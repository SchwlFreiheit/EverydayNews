<style>
.en-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:26px 0 34px}.en-card{border:1px solid var(--line);background:var(--surface);padding:18px 20px}.en-card strong{display:block;font-size:17px;line-height:1.5;color:var(--article-accent);margin-bottom:7px}.en-card p{margin:0!important;font-size:16px!important;line-height:1.78!important}.en-callout{margin:26px 0;padding:19px 21px;border:1px solid var(--line);background:var(--surface);font-size:17px;line-height:1.85}.en-callout.proof{box-shadow:inset 4px 0 0 var(--mint)}.en-callout.warn{box-shadow:inset 4px 0 0 var(--amber)}.en-callout.risk{box-shadow:inset 4px 0 0 var(--rose)}.en-sources{display:grid;gap:8px;margin:24px 0 34px}.en-sources a{display:block;border:1px solid var(--line);background:var(--surface);padding:13px 15px;font-size:16px;line-height:1.6;color:var(--ink);text-decoration:none}.en-sources a:hover{border-color:var(--article-accent)}.en-media-link{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:26px 0;padding:18px 20px;border:1px solid color-mix(in srgb,var(--article-accent) 45%,var(--line));background:color-mix(in srgb,var(--article-accent) 5%,var(--surface));font-size:16px;line-height:1.7}.en-media-link strong{color:var(--article-accent)}.en-media-link a{white-space:nowrap}.en-table{width:100%;border-collapse:collapse;margin:24px 0 32px}.en-table th,.en-table td{font-size:16px;line-height:1.65;text-align:left;vertical-align:top;padding:13px 12px;border-bottom:1px solid var(--line)}.en-table th{color:var(--sub);font-weight:750}.en-video{margin:28px 0 36px;border:1px solid var(--line);background:#050505}.en-video video{display:block;width:100%;max-height:620px}.en-video .caption{padding:14px 16px;background:var(--surface);font-size:16px;line-height:1.75;color:var(--body)}
@media(max-width:850px){.en-grid{grid-template-columns:1fr}.en-media-link{align-items:flex-start;flex-direction:column}}
</style>
<script>
(()=>{
const backlog=['agentcore-ci','browser-mcp','reach-ecc','toolreplay','hronaut','flare-photonic','wave-neuro-robot','clinical-consistency','intent-zero-trust'];
backlog.forEach(id=>document.querySelector(`[data-cand="${id}"]`)?.remove());
const term=(label,desc,orig='')=>`<span class="term" data-term="${label.replace(/"/g,'&quot;')}|${desc.replace(/"/g,'&quot;')}|${orig.replace(/"/g,'&quot;')}">${label}</span>`;
const icon=(body,label)=>`<span class="genre-icon" title="${label}" aria-label="${label}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg></span>`;
const icons={ai:icon('<circle cx="6" cy="12" r="2.2"/><circle cx="18" cy="6" r="2.2"/><circle cx="18" cy="18" r="2.2"/><path d="M8 11l7.8-4M8 13l7.8 4M18 8.2v7.6"/>','AI・エージェント'),security:icon('<path d="M12 3 5 6v5c0 4.7 2.8 8 7 10 4.2-2 7-5.3 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-5"/>','セキュリティ'),chip:icon('<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 9h6v6H9zM9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>','半導体・計算機'),robot:icon('<rect x="5" y="7" width="14" height="11" rx="3"/><path d="M12 3v4M8.5 12h.01M15.5 12h.01M9 16h6M3 11v4M21 11v4"/>','ロボティクス'),neuro:icon('<path d="M9 4a3 3 0 0 0-3 3v1a3 3 0 0 0-2 3c0 1.3.8 2.5 2 3v1a3 3 0 0 0 3 3c1.3 0 2.4-.8 3-1.8V6A3 3 0 0 0 9 4Z"/><path d="M15 4a3 3 0 0 1 3 3v1a3 3 0 0 1 2 3c0 1.3-.8 2.5-2 3v1a3 3 0 0 1-3 3c-1.3 0-2.4-.8-3-1.8V6A3 3 0 0 1 15 4Z"/>','神経科学')};
const feedback=id=>`<div class="feedback" data-article="${id}"></div>`;
const nav=(label)=>`<div class="article-nav"><div class="nav-left"><strong>RADAR</strong><span>${label}</span></div><div class="depth-switch"><button data-mode="overview" class="active">概要</button><button data-mode="explain">解説</button><button data-mode="detail">詳細</button></div><button class="close">×</button><div class="reading-progress"><i></i></div></div>`;
const sources=items=>`<div class="en-sources">${items.map(x=>`<a href="${x[1]}" target="_blank" rel="noopener"><strong>${x[0]}</strong><br>${x[2]} ↗</a>`).join('')}</div>`;
function addStory(a){const feed=document.querySelector('.feed');if(!feed||document.querySelector(`[data-open="${a.id}"]`))return;feed.insertAdjacentHTML('afterbegin',`<button class="story" data-open="${a.id}" style="--accent:${a.color}"><div class="story-top"><div class="meta">${a.icon}<span class="genre-date">${a.date}</span></div><div class="rings" data-scores="${a.score.join(',')}"></div></div><h2>${a.title}</h2><p>${a.summary}</p><span class="rank">00</span><div class="state"></div></button>`)}
function addArticle(a){const anchor=document.getElementById('termPop');if(!anchor||document.getElementById(a.id))return;anchor.insertAdjacentHTML('beforebegin',`<div class="overlay" id="${a.id}" style="--article-accent:${a.color}"><div class="article-shell">${nav(a.kicker)}<div class="article-head"><div><div class="article-kicker">${a.meta}</div><h1>${a.head}</h1><div class="dek">${a.dek}</div></div><aside class="article-aside"><div class="rings" data-scores="${a.score.join(',')}"></div><div class="article-actions"><button class="chatcopy" data-prompt="${a.prompt.replace(/"/g,'&quot;')}">Chat用コピー</button></div></aside></div>${a.overview}${a.explain}${a.detail}</div></div>`)}
const wrap=(mode,body,toc,id)=>`<div class="mode-panel${mode==='detail'?' detail':''}${mode==='overview'?' active':''}" data-mode-panel="${mode}"><div class="mode-layout"><main class="mode-main">${body}${feedback(id)}</main><aside class="toc"><h4>${mode==='overview'?'概要':mode==='explain'?'解説':'詳細'}</h4>${toc}</aside></div></div>`;
const articles=[];

articles.push({id:'agent-qa',color:'#7fd7ff',icon:icons.security,date:'SEP 08–14',score:[86,80,82,96],title:'AIエージェントの変更をPRで試験し、実行履歴も監査する',summary:'AWSはエージェント変更を自動評価して品質低下ならPRを止める構成を公開。ToolReplayは実行履歴から再現不能・重複・権限超過を後から検査する。開発前後の両側を守る組み合わせ。',kicker:'AI AGENT / QUALITY & AUDIT',meta:'AWS公式手順 2026-09-08 + OSS監査ツール 2026-09-14',head:'エージェント開発に「回帰試験」と「行動監査」を入れる',dek:'プロンプトや道具を変えたときの性能低下をマージ前に止め、実行後はエージェントが実際に何をしたかを機械的に検査する二段構え。',prompt:'AIエージェントのCI回帰試験とToolReplayによる実行履歴監査を、A.S.T.R.A.やChatBridgeの開発へ導入する設計として詳しく整理して。',
overview:wrap('overview',`<section class="section"><p class="lead"><strong>クラウド事業者のAmazon Web Servicesは、AIエージェントの変更をコードの${term('プルリクエスト','コード変更を本体へ取り込む前にレビューする単位。','pull request')}ごとに自動評価し、品質が基準を下回れば取り込みを止める実装例を公開しました。</strong> 一方、公開された監査ツール「${term('ToolReplay','AIエージェントが呼び出した道具と結果の履歴を、後から検査するPython製の監査ツール。','ToolReplay')}」は、実行済みの履歴から同じ呼び出しで結果が変わった箇所、無駄な重複、許可外の道具利用を検出します。</p><div class="en-grid"><div class="en-card"><strong>変更前後の性能低下を止める</strong><p>AWSの例では、変更版エージェントを検証環境へ配置し、代表的な質問を実行して正しさや道具選択を採点します。設定した閾値を下回るとPRを失敗扱いにします。</p></div><div class="en-card"><strong>実行後の行動を履歴から追える</strong><p>ToolReplayは通信なしでJSON Lines形式の実行記録を読み、再現不能、重複呼び出し、許可範囲超過を固定規則で報告します。</p></div></div><div class="en-callout warn"><strong>両方とも万能な安全装置ではありません。</strong> AWS例の評価は大規模言語モデルを採点者に使うため揺れが残ります。ToolReplayのハッシュ連鎖も電子署名ではないので、編集者が全体を再封印すれば「誰が作った正しい履歴か」までは保証しません。</div></section>`, `<a href="#aq-e">二段構え</a>`, 'agent-qa'),
explain:wrap('explain',`<section class="section" id="aq-e"><h2>開発時の試験と、運用後の監査は別の問題です</h2><p>AWSの${term('AgentCore Evaluations','Amazon Bedrock AgentCoreに組み込まれた、エージェントの応答や道具選択を採点する評価機能。','AgentCore Evaluations')}は、検証用質問を実エージェントへ投げ、応答の正しさ、目的達成、道具の選択、引数の妥当性などを採点します。コード共有サービスのGitHubが提供する自動実行機能「${term('GitHub Actions','コード更新をきっかけに、テストや配布処理を自動実行する機能。','GitHub Actions')}」に組み込むことで、性能が悪化した変更を自動的に止められます。</p><p>ToolReplayは逆方向です。実行時に保存した「道具名・引数・返答」の履歴を読み、同じ入力なのに返答が違う箇所、状態が変わっていないのに同じ読み取りを繰り返した箇所、宣言した許可一覧にない書き込みなどを探します。<span class="emph-proof">評価結果の文章ではなく、エージェントの行動列そのものを検査する</span>のが役割です。</p><div class="en-grid"><div class="en-card"><strong>事前ゲート</strong><p>新しいプロンプト、モデル、道具、権限設定を入れた後に、既知の代表課題を再実行して劣化を検出します。</p></div><div class="en-card"><strong>事後監査</strong><p>本番や長時間開発で残った道具呼び出し履歴を検査し、異常な反復や権限超過を後から追跡します。</p></div></div></section>`, `<a href="#aq-e">役割の違い</a>`, 'agent-qa'),
detail:wrap('detail',`<section class="section"><h2>実装するときに見落としやすい条件</h2><p>AWSの参考実装は、機械対機械の認証で検証環境を呼び出し、${term('OpenTelemetry','分散システムの処理経路や計測値を共通形式で記録する観測規格。','OpenTelemetry')}形式の追跡記録をクラウド監視サービスへ保存してから評価します。つまり「最終回答だけ」を比べる方式ではなく、道具選択を含む実行過程を採点できます。ただし、ユーザー役割を使わない機械認証だけで試験すると、実ユーザーの権限制約を十分に再現できないケースがあります。</p><p>ToolReplayはPython 3.11以上で第三者実行依存がなく、ネットワークも使いません。履歴を${term('SHA-256','データから固定長の値を作る暗号学的ハッシュ関数。改変検出によく使われる。','SHA-256')}で連鎖させ、途中の記録が後から変われば後続の値も変わるようにします。<span class="emph-caution">ただし電子署名ではないため、攻撃者がファイル全体を再封印できる状況では真正性の保証になりません。</span></p><table class="en-table"><tr><th>検査したい問題</th><th>向いている方法</th><th>残る弱点</th></tr><tr><td>変更で回答品質が落ちた</td><td>代表課題をPRごとに再実行</td><td>課題集合が狭いと未測定の劣化を見逃す</td></tr><tr><td>同じ道具呼び出しが無駄に繰り返された</td><td>ToolReplayの重複検査</td><td>意味的に似た別引数までは判定しない</td></tr><tr><td>読み取り専用エージェントが書き込んだ</td><td>許可一覧との照合</td><td>道具名の許可だけでは引数内容の危険性を見ない</td></tr><tr><td>履歴が改変された</td><td>ハッシュ連鎖の検証</td><td>署名鍵がないため作成者の真正性は別途必要</td></tr></table>${sources([['AWS公式解説','https://aws.amazon.com/blogs/machine-learning/automated-agent-evaluation-with-amazon-bedrock-agentcore-and-github-actions/','PRを止める評価パイプラインと認証・評価構成'],['ToolReplay公式リポジトリ','https://github.com/Matthew0822/ToolReplay','実際のコマンド、検出規則、限界、サンプル履歴']])}</section>`, `<a href="#">条件と限界</a>`, 'agent-qa')});

articles.push({id:'browser-continuity',color:'#9dd7ff',icon:icons.ai,date:'CURRENT',score:[78,75,79,90],title:'ログイン済みブラウザをAIへ渡す2方式',summary:'Hronautは専用Chromiumのタブ・Cookie・作業領域をセッション越しに保持。Browser MCPは普段使いのChromeを直接操作する。便利さと権限リスクがかなり違う。',kicker:'AI AGENT / BROWSER CONTROL',meta:'Hronaut + Browser MCP · verified 2026-09-16',head:'ログイン済みブラウザをAIへ渡すなら、分離型と直結型で危険度が違う',dek:'どちらもログインを毎回やり直さずエージェントにWeb操作を任せるが、「専用ブラウザを永続化する」方式と「普段のブラウザを直接触らせる」方式は安全境界が違う。',prompt:'HronautとBrowser MCPを、セッション永続性、ログイン状態、権限境界、人間の引き継ぎ、Opera Connectorとの重複、セキュリティの観点で比較して。',
overview:wrap('overview',`<section class="section"><p class="lead"><strong>ブラウザ自動化サービスのHronautは、AI専用のChromiumブラウザをパソコン内で動かし、ログイン状態、Cookie、開いているタブ、名前を付けた作業領域を次のセッションまで残します。</strong> 一方、オープンソースの「Browser MCP」は、ユーザーが普段使っているログイン済みChromeへAIを直接接続します。</p><div class="en-grid"><div class="en-card"><strong>HronautはAI用ブラウザを分離して残す</strong><p>Codexなどの作業が終わってもタブと認証状態を保持できます。人間が同じ画面を見て操作を引き継げます。</p></div><div class="en-card"><strong>Browser MCPは普段のChromeをそのまま使う</strong><p>既存のCookieや二要素認証済み状態を利用できるため導入は軽い一方、個人ブラウザへ与える権限が広くなります。</p></div></div><div class="en-callout risk"><strong>利便性の差より、権限境界の差が重要です。</strong> 普段のメールや決済サイトまで開けるブラウザをエージェントへ直接渡す場合、Webページ中の命令文を誤って実行する「プロンプト注入」の影響範囲も広がります。</div></section>`, `<a href="#bc-e">2方式</a>`, 'browser-continuity'),
explain:wrap('explain',`<section class="section" id="bc-e"><h2>Hronautは「別の仕事机」、Browser MCPは「自分の机を共有」に近いです</h2><p>${term('Hronaut','AIエージェント向けに、ログイン状態とタブを永続化した専用Chromiumを提供するローカルブラウザ自動化サービス。','Hronaut')}は、パソコン内のループバック接続で動く${term('MCP','AIが外部の道具やデータ源を共通形式で呼び出すための接続規格。','Model Context Protocol')}サーバーを通して、専用Chromiumを操作させます。AI作業ごとに名前付き領域を分けられるため、認証を残しながら他の作業との混線を抑えられます。</p><p>${term('Browser MCP','普段のログイン済みChromeを、MCP経由でAIエージェントから操作できるオープンソース拡張。','Browser MCP')}は既存Chromeへ直接接続し、多数のブラウザ操作をAIへ公開します。二要素認証済みサイトや、メールで受け取ったログインコードを人間が再入力せず使える場面は強い反面、個人セッションそのものが攻撃面になります。</p><div class="en-media-link"><div><strong>実画面を確認する価値があります。</strong><br>Hronautは公式ページに永続ワークスペースと人間引き継ぎの画面、Browser MCPはGitHubに対応ツールとセットアップを掲載しています。</div><div><a href="https://hronaut.dev/" target="_blank" rel="noopener">Hronaut実画面 ↗</a><br><a href="https://github.com/AgentDeskAI/browser-mcp" target="_blank" rel="noopener">Browser MCP仕様 ↗</a></div></div></section>`, `<a href="#bc-e">安全境界</a>`, 'browser-continuity'),
detail:wrap('detail',`<section class="section"><h2>ユーザー環境では「既にある接続」との重複も見るべきです</h2><table class="en-table"><tr><th>比較点</th><th>Hronaut</th><th>Browser MCP</th></tr><tr><td>ログイン状態</td><td>専用Chromium内に永続化</td><td>普段のChromeの既存状態を使用</td></tr><tr><td>セッション分離</td><td>名前付き作業領域で分けやすい</td><td>ユーザーの通常プロファイルと近い</td></tr><tr><td>人間の介入</td><td>可視ブラウザで一時停止・引き継ぎを想定</td><td>普段のChromeなので人間が同じ画面を操作可能</td></tr><tr><td>費用・公開性</td><td>試用後は有料、ソース公開型だが独占ライセンス</td><td>MITライセンスのオープンソース</td></tr><tr><td>主な危険</td><td>専用ブラウザ内の認証資産</td><td>普段のブラウザ全体へ権限が広がりやすい</td></tr></table><p>既にブラウザ接続機能を使っている環境では、機能追加だけを目的に別の接続を増やすと、認証情報を持つ経路と権限境界が増えます。<span class="emph-caution">新しいMCPを追加する価値は、「現在の接続にない永続性や並列作業領域が本当に必要か」で判断した方が安全です。</span></p>${sources([['Hronaut公式','https://hronaut.dev/','永続タブ、ログイン、ワークスペース、人間引き継ぎ、料金'],['Browser MCP公式リポジトリ','https://github.com/AgentDeskAI/browser-mcp','既存Chrome接続、公開ツール、MITライセンス']])}</section>`, `<a href="#">導入判断</a>`, 'browser-continuity')});

articles.push({id:'reach-ecc',color:'#d2b6ff',icon:icons.chip,date:'SEP 09',score:[84,65,89,69],title:'HBMの強い誤り訂正を「普段」と「非常時」に分けるREACH',summary:'AI推論で使うHBM向けに、日常的な小さな誤りは軽い訂正、解決できない部分だけ長区間コードへ回す設計。シミュレーションでは高帯域と低い制御回路コストを両立したが、実チップ検証はまだない。',kicker:'SEMICONDUCTOR / MEMORY RELIABILITY',meta:'arXiv preprint · 2026-09-09',head:'HBMの誤り訂正を二段階にして、帯域を守るREACH',dek:'AI推論の読み出し偏重を利用し、強力だが重い長区間誤り訂正を例外処理へ追い出すメモリ制御方式。',prompt:'REACHのHBM向けECCについて、内側コード、長区間外側コード、erasure repair、differential parity、Ramulator2評価、面積電力モデル、実機未検証の限界を説明して。',
overview:wrap('overview',`<section class="section"><p class="lead"><strong>半導体メモリの研究チームは、AI推論で大量に使う${term('HBM','AI向けGPUなどで使われる、複数のメモリ層を積層して非常に高い転送帯域を得るメモリ。','High-Bandwidth Memory')}の誤り訂正を、軽い日常処理と重い救済処理に分ける「REACH」を提案しました。</strong> 通常の誤りは既存の小さな訂正符号で処理し、そこで解決できなかった部分だけを長い範囲の強力な符号で修復します。</p><div class="en-grid"><div class="en-card"><strong>高負荷条件でもアプリ向け転送1.88 TB/s</strong><p>メモリシミュレータ上の最も厳しい誤り条件で測定した値です。</p></div><div class="en-card"><strong>解析上の2.69 TB/s設計で制御回路面積55.8%減</strong><p>比較対象は、長区間訂正を直接適用する評価設計の平均作業量モデルです。実チップ面積の実測ではありません。</p></div></div><div class="en-callout warn"><strong>結果はまだシミュレーションと回路合成モデルです。</strong> 実際のHBM製品へ載せたシリコン測定ではないため、確度の点数は意図的に抑えています。</div></section>`, `<a href="#re-e">二段階</a>`, 'reach-ecc'),
explain:wrap('explain',`<section class="section" id="re-e"><h2>長い範囲の訂正を毎回走らせないのが中心です</h2><p>${term('ECC','メモリのビット化けを検出・訂正するために、追加の検査情報を持つ仕組み。','Error-Correcting Code')}を広い範囲へかけると強い誤りへ耐えられますが、小さな読み出しでも大きな範囲の状態を扱う必要が生じ、帯域と回路コストが増えます。REACHは、内側の既存符号で普段の誤りを直し、「どの塊がまだ壊れているか」が分かった場合だけ外側の長区間符号へ渡します。</p><p>大規模言語モデルの推論では、学習時より書き込みが少なく、連続した読み出しが多いという性質があります。研究はこの偏りを利用し、複数の読み出しをまとめながら長区間修復に必要な情報を蓄積します。</p></section>`, `<a href="#re-e">仕組み</a>`, 'reach-ecc'),
detail:wrap('detail',`<section class="section"><h2>数字の意味を分けて読む必要があります</h2><p>1.88 TB/sは${term('Ramulator2','DRAMやHBMの動作を詳細に模擬するメモリシミュレータ。','Ramulator2')}上で、誤り率を高くしたストレス条件でも維持したアプリケーション向け帯域です。2.69 TB/sは別の回路合成条件で設定した解析上の目標で、同じ測定の実測値ではありません。</p><p>面積55.8%減、モデル化した電力57.7%減という比較も、評価した「長区間訂正を直接使う設計」の平均作業量に対するものです。<span class="emph-risk">HBMベンダーの実装と比べて55.8%小さい、という意味ではありません。</span></p><div class="en-callout proof">設計上の価値は、強い誤り訂正を弱めたことではなく、<strong>強い訂正が必要な要求だけへ高コスト処理を限定した</strong>点にあります。この「普段の軽い経路＋例外時の強い経路」は、メモリ以外の信頼性設計にも一般化しやすい考え方です。</div>${sources([['REACH原論文','https://arxiv.org/abs/2609.10861','方式、シミュレーション条件、回路合成、比較結果']])}</section>`, `<a href="#">評価条件</a>`, 'reach-ecc')});

articles.push({id:'flare-photonic',color:'#7ef1d1',icon:icons.chip,date:'AUG 27',score:[88,91,92,55],title:'7,378個の光ニューロンで「記憶しながら計算する」FLARE',summary:'光回路の中に長期記憶と高速な短期応答を持たせ、記憶・計算・センシングを同じチップに統合。10コア系でドローン探索と適応を実証した査読済み研究。',kicker:'PHOTONICS / IN-MEMORY COMPUTING',meta:'Nature Sensors · peer-reviewed · 2026-08-27',head:'光回路が「記憶の外部往復」を減らすFLARE',dek:'7,378個の光子ニューロンを一体化し、秒単位の保持とGHz級の短期応答を同じ計算基盤で扱う。',prompt:'FLAREのfully in-memory photonic computingについて、光子ニューロンの長期・短期記憶、7378ニューロン、10コア、ドローン課題、61.87 aJ/opの測定境界と限界を詳しく説明して。',
overview:wrap('overview',`<section class="section"><p class="lead"><strong>清華大学の研究チームは、光で計算するニューロン回路の中に記憶機能も持たせる「${term('FLARE','光回路の中でセンシング・計算・記憶を一体化するフォトニック計算アーキテクチャ。','FLARE')}」を7,378ニューロン規模で作りました。</strong> チップは7.45秒の長期保持を示しながら、短期側ではGHz級の高速な状態変化を保ち、10コア構成でレーシングドローンの環境探索と適応課題を実演しています。</p><div class="en-grid"><div class="en-card"><strong>7.45秒の長期記憶とGHz級短期応答を同居</strong><p>外部デジタルメモリへ毎回状態を移す構成を減らす狙いです。</p></div><div class="en-card"><strong>システム評価で1演算61.87アトジュール</strong><p>論文が定義したシステム境界でのエネルギー値です。他方式と単純な「GPU比」に読み替える値ではありません。</p></div></div><div class="en-media-link"><div><strong>実物のFigure 5と補足動画があります。</strong><br>論文ページでは、実チップの機械視覚処理とドローン課題の結果を図・動画で確認できます。</div><a href="https://www.nature.com/articles/s44460-026-00123-2#Fig5" target="_blank" rel="noopener">Figure 5を見る ↗</a></div></section>`, `<a href="#fl-e">統合の意味</a>`, 'flare-photonic'),
explain:wrap('explain',`<section class="section" id="fl-e"><h2>通常は「計算する場所」と「覚える場所」の往復が必要です</h2><p>多くの計算機では、演算回路とメモリが分かれているため、データ移動そのものが時間と電力を消費します。FLAREは${term('フォトニック計算','電気信号だけでなく光の伝搬・干渉・変調を計算へ使う方式。','photonic computing')}のニューロンに短期状態と長期状態を持たせ、センサー入力、途中の活性、記憶を外部メモリへ往復させる量を減らします。</p><p>論文の10コア多層系では、ドローン向けの視覚入力を処理し、未知環境を探索した後に新しい環境へ適応する課題を示しています。<span class="emph-proof">チップ自体が実在し、7,378ニューロンの単一チップ測定と源データが公開されている</span>点は、シミュレーションだけの提案より確度が高い部分です。</p></section>`, `<a href="#fl-e">なぜ速いか</a>`, 'flare-photonic'),
detail:wrap('detail',`<section class="section"><h2>エネルギー値と「ドローン実証」の読み方</h2><p>61.87 ${term('アトジュール','1ジュールの10の18乗分の1という非常に小さなエネルギー単位。','attojoule')} / 演算という数字は、論文のシステム定義に基づく測定・算定値です。異なる方式では「1演算」に含める範囲が違うため、GPUや別の光計算チップの数字と条件なしに並べるべきではありません。</p><p>ドローン課題についても、論文は補足動画を公開していますが、チップが市販ドローンへそのまま搭載され、一般環境で自律飛行製品として動いたという意味ではありません。<span class="emph-caution">研究用の機械視覚・探索・適応タスクとして、どの処理をFLAREが担ったかを分けて読む必要があります。</span></p>${sources([['査読済み原論文','https://www.nature.com/articles/s44460-026-00123-2','7,378ニューロン、保持時間、GHz応答、10コア、エネルギー、Figureと源データ']])}</section>`, `<a href="#">限界</a>`, 'flare-photonic')});

articles.push({id:'wave-neuro-robot',color:'#72d6ff',icon:icons.robot,date:'SEP 10',score:[80,93,91,55],title:'水面波そのものに障害物を判定させ、実ロボット車を動かす',summary:'Oxfordの研究は、水面波の干渉を計算媒体として使い、障害物認識からArduino車のリアルタイム回避まで実演。将来のスピン波チップ版はまだシミュレーション。',kicker:'NEUROMORPHIC / ROBOTICS',meta:'Nature Communications · open access · 2026-09-10',head:'水面波を計算機にして、ロボット車をリアルタイム制御する',dek:'波の干渉そのものを「リザバー計算」に使い、認識結果をロボットの進行方向へ直接つなげた実験。',prompt:'水面波ベースのneuromorphic hardware研究について、reservoir computing、実水槽、障害物認識、Arduino車、spin-wave simulation、実機とシミュレーションの境界を説明して。',
overview:wrap('overview',`<section class="section"><p class="lead"><strong>オックスフォード大学の研究チームは、水槽で生じる水面波の干渉を「計算そのもの」に使い、障害物を認識して実物のArduinoロボット車をリアルタイムに回避走行させました。</strong> デジタルのニューラルネットワークが波を数値計算したのではなく、入力した波が物理的に混ざる現象を情報処理へ利用しています。</p><div class="en-grid"><div class="en-card"><strong>水槽の波で障害物をほぼ完全に分類</strong><p>波の応答パターンから障害物状態を読み取り、車の操作へつなげました。</p></div><div class="en-card"><strong>固体チップ候補はまだシミュレーション</strong><p>GHz帯で動く磁性体のスピン波版も計算しましたが、実際のスピン波ロボット用チップを作ったわけではありません。</p></div></div><div class="en-video"><video controls preload="metadata" src="https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fs41467-026-77661-3/MediaObjects/41467_2026_77661_MOESM4_ESM.mp4"></video><div class="caption"><strong>実物動画：</strong>論文の補足動画2。水面波の計算結果でArduino車が障害物を避ける実験です。Nature Communications、CC BY 4.0。</div></div></section>`, `<a href="#wv-e">波が計算する</a>`, 'wave-neuro-robot'),
explain:wrap('explain',`<section class="section" id="wv-e"><h2>同じ入力でも、波の重なり方が状態を豊かに変換します</h2><p>${term('リザバー計算','複雑に変化する物理系へ入力を与え、その状態変化を特徴量として読み出す機械学習方式。','reservoir computing')}では、内部ネットワークの全結合を学習する代わりに、複雑な物理応答をそのまま高次元の変換として使い、最後の読み出し部分を学習します。この研究では、その物理系が水面波です。</p><p>研究者は障害物情報を波へ符号化し、干渉後の波形から分類結果を読みました。分類結果は実時間でロボット車の制御へ渡されます。<span class="emph-proof">「水槽で分類できた」だけでなく、実物の車両を閉ループで動かした</span>ところが研究上の一段大きい点です。</p></section>`, `<a href="#wv-e">物理計算</a>`, 'wave-neuro-robot'),
detail:wrap('detail',`<section class="section"><h2>将来像のスピン波版と、今回の実験を混同しない</h2><p>論文後半は、磁性体中の集団的な磁化の波である${term('スピン波','磁性体内部で磁気モーメントの向きの変化が波として伝わる現象。','spin wave')}を使えば、同じ考えをGHz帯の小型固体素子へ移せる可能性を${term('マイクロ磁気シミュレーション','磁性体内部の磁化を微小領域ごとに計算して時間発展を模擬する方法。','micromagnetic simulation')}で示しています。</p><p><span class="emph-risk">実験でロボットを動かした計算媒体は水面波です。スピン波チップはシミュレーションであり、実チップを製造して車へ搭載した結果ではありません。</span> この境界を明確にすると、研究の実績と将来像を両方正しく評価できます。</p>${sources([['Nature Communications原論文','https://www.nature.com/articles/s41467-026-77661-3','水面波実験、Arduino車、補足動画、スピン波シミュレーション、CC BY 4.0']])}</section>`, `<a href="#">実験と将来像</a>`, 'wave-neuro-robot')});

articles.push({id:'clinical-stability',color:'#ffb07c',icon:icons.neuro,date:'SEP 15',score:[92,95,88,70],title:'AIを同じ症例で複数回走らせ、「答えの安定性」を信頼度にする',summary:'Nature Medicineの臨床AI研究では、同一症例への複数回回答が一致する度合いが、正誤を見分ける強い信頼度指標になった。安定性0.90以上だけを自動処理すると49.4%の症例で98.9%精度。',kicker:'AI RELIABILITY / MEDICINE',meta:'Nature Medicine · peer-reviewed · 2026-09-15',head:'「同じ質問に何度答えても同じか」をAIの信頼度に使う',dek:'モデル自身の自信の言葉だけではなく、独立実行を繰り返したときの診断一致度を、判断を自動化してよいかの信号にする。',prompt:'Nature Medicineのon-premise clinical AI agents研究について、behavioral consistency、AUC 0.860、threshold 0.90、49.4% retained、98.9% accuracy、適用範囲と一般エージェントへの一般化限界を説明して。',
overview:wrap('overview',`<section class="section"><p class="lead"><strong>Nature Medicineに掲載された臨床AI研究は、同じ症例をAIへ複数回解かせ、最終診断がどれだけ一致するかを「この回答を任せてよいか」の信頼度として使いました。</strong> 診断の一致度は正解と不正解を見分ける指標として${term('AUC 0.860','正しい診断を高信頼、不正解を低信頼として並べ分ける性能を示す面積指標。1に近いほど識別が良い。','area under the ROC curve')}を示し、ストレス条件でも0.875でした。</p><div class="en-grid"><div class="en-card"><strong>一致度0.90以上の49.4%だけを自動処理</strong><p>半分強の症例は人へ戻す保守的な運用です。</p></div><div class="en-card"><strong>残した症例では診断精度98.9%</strong><p>「全症例を高精度で自動化した」という結果ではなく、高信頼な部分集合へ絞った精度です。</p></div></div><div class="en-callout proof">重要なのは、AIに「自信がありますか」と聞くのではなく、<strong>同じ入力で振る舞いが再現するかを外から測る</strong>方法が有力だったことです。</div></section>`, `<a href="#cs-e">安定性</a>`, 'clinical-stability'),
explain:wrap('explain',`<section class="section" id="cs-e"><h2>「言葉で自信を語る」より、行動の再現性が強かった</h2><p>研究チームは、モデル内部の確率、理由文に表れる自信、複数回実行した診断の安定性など、複数種類の不確実性指標を比較しました。その中で最も正誤をよく分けたのが${term('行動的一貫性','同じ症例へ独立に複数回回答させ、最終判断が意味的にどれだけ一致するかを測る信頼度。','behavioral consistency')}でした。</p><p>この仕組みは「安定しているから必ず正しい」という保証ではありません。間違った診断へ毎回同じように収束する可能性もあります。そこで研究は、安定性を単独の真理判定ではなく、<span class="emph-caution">人間へ戻す症例を選ぶ選別信号</span>として使っています。</p></section>`, `<a href="#cs-e">何を測るか</a>`, 'clinical-stability'),
detail:wrap('detail',`<section class="section"><h2>一般エージェントへ持ち出すときの条件</h2><p>研究は病院内で動かせる臨床エージェントを対象にし、二つのMIMIC-IV由来ベンチマークで診断性能と信頼度を評価しています。主課題の7疾患分類は90.04%、別の4疾患課題は83.8%でした。行動的一貫性は診断正誤の識別でAUC 0.860、ストレス試験で0.875でした。</p><p>一般のコーディングエージェントでも「同じタスクを複数回走らせて結論が一致するか」は使えますが、<span class="emph-risk">医療診断で得た閾値0.90や精度98.9%を、そのままコード生成やWeb操作へ適用する根拠はありません。</span> また複数回実行するため計算費と待ち時間が増えます。</p>${sources([['Nature Medicine原論文','https://www.nature.com/articles/s41591-026-04609-x','評価課題、信頼度指標、AUC、選別自動化、源データ']])}</section>`, `<a href="#">一般化の限界</a>`, 'clinical-stability')});

articles.push({id:'intent-gate',color:'#ff8b9f',icon:icons.security,date:'SEP 15',score:[83,68,78,88],title:'AIの道具呼び出しを「形式」ではなく「元の依頼」と照合する',summary:'Googleは、SQLやAPIが正しい形でも、ユーザーの意図や業務規則に意味的に合っているかを別の判定層で確認するゼロトラスト型エージェント設計を公開。実測の独立検証はまだない。',kicker:'AI SECURITY / RUNTIME GOVERNANCE',meta:'Google Developers Blog · 2026-09-15',head:'AIの操作を「正しい構文か」だけでなく「本当に頼まれたことか」で止める',dek:'プロンプト注入や社会工学で、形式上は合法な操作が意図から外れる問題を、実行直前の意味判定で抑える設計。',prompt:'Googleのzero-trust agent intent gatingについて、deterministic controls、semantic intent gate、runtime governance、prompt injection対策、誤判定、独立検証不足、A.S.T.R.A.への応用を説明して。',
overview:wrap('overview',`<section class="section"><p class="lead"><strong>Googleの開発者チームは、AIエージェントが道具を実行する直前に、その操作が「元のユーザー依頼」と「業務規則」に意味として一致しているかを別の判定層で確認する設計を公開しました。</strong> SQL文やAPI呼び出しが形式上正しくても、ユーザーが頼んでいない返金や権限変更なら止める考え方です。</p><div class="en-grid"><div class="en-card"><strong>従来の固定規則</strong><p>許可された道具、署名済み書き込み、隔離実行、入力出力の形式検査など、事前に列挙できる条件を守ります。</p></div><div class="en-card"><strong>追加する意図ゲート</strong><p>実行内容が会話の目的と意味的に整合するかを、実行時に判断します。</p></div></div><div class="en-callout warn"><strong>Googleの設計記事であり、独立した攻撃ベンチマークはまだ示されていません。</strong> そのため「この方式で攻撃を何%防げる」とは言えず、確度は中程度にしています。</div></section>`, `<a href="#ig-e">なぜ必要</a>`, 'intent-gate'),
explain:wrap('explain',`<section class="section" id="ig-e"><h2>構文が正しいことと、操作が正当なことは別です</h2><p>入力値の形式検査やSQL解析は、危険な文字列や禁止命令を止めるのに有効です。しかし、攻撃者が会話でAIを説得し、「形式は正しいが、本来の依頼から外れた操作」を実行させる場合があります。Googleが言う${term('意図ゲート','道具呼び出しを実行する前に、その操作がユーザーの目的や業務規則と意味的に一致するか判定する層。','intent gate')}は、この隙間を狙います。</p><p>これは${term('ゼロトラスト','内部からの要求でも自動的に信用せず、操作ごとに権限や妥当性を確認する安全設計。','zero trust')}の考え方をエージェントへ持ち込むものです。道具が呼べるという事実だけで実行を許さず、毎回「この操作を今する理由」を検査します。</p></section>`, `<a href="#ig-e">意味判定</a>`, 'intent-gate'),
detail:wrap('detail',`<section class="section"><h2>意味判定器そのものも誤るので、多層防御が前提です</h2><p>意味を理解する判定器も大規模言語モデルを使うため、誤って正当操作を止める${term('偽陽性','安全な操作を危険だと誤判定すること。','false positive')}と、危険操作を通す偽陰性が残ります。したがって、固定の権限、実行環境の隔離、署名、入力出力検査を捨てて意図ゲートだけへ置き換える設計ではありません。</p><p>長時間エージェントでは、一つ一つの操作が妥当でも、複数ターンを通して資源を吸い上げる攻撃もあります。記事は挙動の異常検知と是正も組み合わせています。<span class="emph-caution">実装価値は高い一方、効果量を示す第三者評価がないため、採用時には自前の攻撃テストが必要です。</span></p>${sources([['Google公式技術記事','https://developers.googleblog.com/build-zero-trust-ai-agents-that-judge-intent-not-just-syntax/','意図ゲート、実行時統制、異常是正、固定規則との併用']])}</section>`, `<a href="#">限界</a>`, 'intent-gate')});

for(const a of articles){addStory(a);addArticle(a)}
[...document.querySelectorAll('.feed .story .rank')].forEach((r,i)=>r.textContent=String(i+1).padStart(2,'0'));
