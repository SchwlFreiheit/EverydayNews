<script>
(()=>{
const term=(label,desc,orig='')=>`<span class="term" data-term="${label.replace(/"/g,'&quot;')}|${desc.replace(/"/g,'&quot;')}|${orig.replace(/"/g,'&quot;')}">${label}</span>`;
const icon=(body,label)=>`<span class="genre-icon" title="${label}" aria-label="${label}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg></span>`;
const icons={image:icon('<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m4 18 5-5 3 3 3-4 5 6"/>','画像生成・編集'),physics:icon('<circle cx="12" cy="12" r="2"/><ellipse cx="12" cy="12" rx="9" ry="3.5"/><ellipse cx="12" cy="12" rx="3.5" ry="9" transform="rotate(35 12 12)"/>','物理'),bio:icon('<path d="M7 3c6 2 4 7 10 9M17 21c-6-2-4-7-10-9M8 5l7 3M6 10l12 5M9 16l7 3"/>','生物・医学'),neuro:icon('<path d="M9 4a3 3 0 0 0-3 3v1a3 3 0 0 0-2 3c0 1.3.8 2.5 2 3v1a3 3 0 0 0 3 3c1.3 0 2.4-.8 3-1.8V6A3 3 0 0 0 9 4Z"/><path d="M15 4a3 3 0 0 1 3 3v1a3 3 0 0 1 2 3c0 1.3-.8 2.5-2 3v1a3 3 0 0 1-3 3c-1.3 0-2.4-.8-3-1.8V6A3 3 0 0 1 15 4Z"/>','神経科学'),watch:icon('<circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2M8 3l-2-2M16 3l2-2"/>','Codex監視')};
const nav=(label)=>`<div class="article-nav"><div class="nav-left"><strong>RADAR</strong><span>${label}</span></div><div class="depth-switch"><button data-mode="overview" class="active">概要</button><button data-mode="explain">解説</button><button data-mode="detail">詳細</button></div><button class="close">×</button><div class="reading-progress"><i></i></div></div>`;
const feedback=id=>`<div class="feedback" data-article="${id}"></div>`;
const wrap=(mode,body,toc,id)=>`<div class="mode-panel${mode==='detail'?' detail':''}${mode==='overview'?' active':''}" data-mode-panel="${mode}"><div class="mode-layout"><main class="mode-main">${body}${feedback(id)}</main><aside class="toc"><h4>${mode==='overview'?'概要':mode==='explain'?'解説':'詳細'}</h4>${toc}</aside></div></div>`;
const sources=items=>`<div class="en-sources">${items.map(x=>`<a href="${x[1]}" target="_blank" rel="noopener"><strong>${x[0]}</strong><br>${x[2]} ↗</a>`).join('')}</div>`;
function addStory(a){const feed=document.querySelector('.feed');if(!feed||document.querySelector(`[data-open="${a.id}"]`))return;feed.insertAdjacentHTML('afterbegin',`<button class="story" data-open="${a.id}" style="--accent:${a.color}"><div class="story-top"><div class="meta">${a.icon}<span class="genre-date">${a.date}</span></div><div class="rings" data-scores="${a.score.join(',')}"></div></div><h2>${a.title}</h2><p>${a.summary}</p><span class="rank">00</span><div class="state"></div></button>`)}
function addArticle(a){const anchor=document.getElementById('termPop');if(!anchor||document.getElementById(a.id))return;anchor.insertAdjacentHTML('beforebegin',`<div class="overlay" id="${a.id}" style="--article-accent:${a.color}"><div class="article-shell">${nav(a.kicker)}<div class="article-head"><div><div class="article-kicker">${a.meta}</div><h1>${a.head}</h1><div class="dek">${a.dek}</div></div><aside class="article-aside"><div class="rings" data-scores="${a.score.join(',')}"></div><div class="article-actions"><button class="chatcopy" data-prompt="${a.prompt.replace(/"/g,'&quot;')}">Chat用コピー</button></div></aside></div>${a.overview}${a.explain}${a.detail}</div></div>`)}
const articles=[];

articles.push({id:'llada-image',color:'#d5a4ff',icon:icons.image,date:'SEP 03–04',score:[78,62,88,84],title:'生成と編集を1モデルにまとめた6B画像AI「LLaDA-Image」',summary:'InclusionAIが6B規模の画像生成・編集モデルと4ステップ版を公開。実際の重みと推論コードは動かせる一方、「完全公開」を掲げる論文に対して学習コードは現在も未公開。',kicker:'IMAGE AI / OPEN WEIGHTS',meta:'inclusionAI · arXiv 2026-09-03 · checkpoints 2026-09-04',head:'画像生成と参照画像編集を一つにしたLLaDA-Image',dek:'50ステップの高品質版と4ステップの高速版を公開。公式の生成例は強いが、作者ベンチと未公開の学習コードを分けて評価する必要がある。',prompt:'LLaDA-Imageについて、6B DiT、画像だけの事前学習、生成と編集の統合、Base 50 steps、Turbo 4 steps、Qwen-Image-Bench、公開済みと未公開の境界、RTX 3070での現実性を整理して。',
overview:wrap('overview',`<section class="section"><p class="lead"><strong>AI研究組織のinclusionAIは、文章からの画像生成と、参照画像を指示どおりに編集する機能を一つの6B規模モデルへまとめた「${term('LLaDA-Image','inclusionAIが公開した、画像生成と参照画像編集を一つのモデルで行う画像AI。','LLaDA-Image')}」を公開しました。</strong> 標準版は50回の生成ステップ、高速版「Turbo」は4回を推奨し、重みと推論コードは実際にダウンロードできます。</p><div class="actual-media"><div class="media-label"><span>実物｜公式リポジトリの生成例</span><a href="https://github.com/inclusionAI/LLaDA-Image" target="_blank" rel="noopener">公式READMEを開く ↗</a></div><a href="https://github.com/inclusionAI/LLaDA-Image" target="_blank" rel="noopener"><img src="https://raw.githubusercontent.com/inclusionAI/LLaDA-Image/main/assets/demo.jpg" alt="LLaDA-Image公式リポジトリの実生成例" loading="lazy"></a><div class="media-caption"><strong>見る場所：</strong>自然光、人物・物体のまとまり、細部の破綻を確認できます。これは作者側の選抜例なので、平均的な出力品質の証明ではありません。</div></div><div class="en-grid"><div class="en-card"><strong>標準版は50ステップ、高速版は4ステップ</strong><p>高速版は蒸留で処理回数を減らしています。READMEは2〜4ステップ対応とし、通常利用は4ステップを推奨しています。</p></div><div class="en-card"><strong>重みと推論コードは公開、学習コードは未公開</strong><p>論文題名は「完全公開の学習レシピ」を掲げますが、公式GitHubの公開計画では学習コードは現在も「coming soon」です。</p></div></div></section>`, `<a href="#li-e">何が統合された？</a>`, 'llada-image'),
explain:wrap('explain',`<section class="section" id="li-e"><h2>「作る」と「直す」を同じモデルで扱います</h2><p>モデル本体は60億規模の${term('拡散トランスフォーマー','ノイズから画像へ戻す拡散過程を、Transformer型ネットワークで予測する画像生成方式。','Diffusion Transformer / DiT')}です。文章から新規画像を作るだけでなく、参照画像と「服を変える」「背景を変える」などの指示を一緒に与え、元画像を保ちながら編集できます。</p><p>研究は最初から大量の画像・文章ペアだけで学習させず、まず画像だけから視覚パターンを学ばせ、その後に言語条件と編集学習を加えています。作者側の${term('Qwen-Image-Bench','画像生成の品質や指示追従を比較する評価セット。ここでの数値は作者側の評価。','Qwen-Image-Bench')}では英語53.53、中国語53.38を報告していますが、第三者による同条件再測定はまだ十分ではありません。</p><div class="actual-media"><div class="media-label"><span>実物｜公式の編集例</span><a href="https://github.com/inclusionAI/LLaDA-Image" target="_blank" rel="noopener">元ページ ↗</a></div><a href="https://github.com/inclusionAI/LLaDA-Image" target="_blank" rel="noopener"><img src="https://raw.githubusercontent.com/inclusionAI/LLaDA-Image/main/assets/edit_demo.jpg" alt="LLaDA-Image公式の参照画像編集例" loading="lazy"></a><div class="media-caption"><strong>見る場所：</strong>指示した部分だけを変えながら、人物や構図など元画像の内容をどこまで保持できているかを見ます。</div></div></section>`, `<a href="#li-e">生成＋編集</a>`, 'llada-image'),
detail:wrap('detail',`<section class="section"><h2>「公開モデル」と「完全に再現できる研究」はまだ同じではありません</h2><p>公開リポジトリには標準精度のBF16版と、メモリ量を減らすFP8版の重み、Diffusersベースの推論コードがあります。標準版の例は1024×1024・50ステップ、高速版は4ステップです。画像生成では縦横が16の倍数、参照画像編集では32の倍数という実装条件があります。</p><p>一方、公式GitHubの公開計画では学習コードが未公開です。論文は詳細なレシピを示しますが、<span class="emph-risk">第三者がデータ準備から学習まで完全に再現できる状態とはまだ言えません。</span> また、RTX 3070級GPUで実用速度・必要VRAMがどうなるかは公式READMEだけでは確定できません。FP8版があることは有利ですが、手元環境での実測が必要です。</p><div class="en-callout warn"><strong>「作者のベンチで高得点」と「自分の用途で画像が良い」は別です。</strong> 人物、文字、複数物体、局所編集など、自分が多用する条件で同じシードと設定を固定し、他モデルと横並びにするのが適切です。</div>${sources([['公式GitHub','https://github.com/inclusionAI/LLaDA-Image','重み、推論コード、実生成例、標準版とTurbo版、未公開の学習コード'],['原論文','https://arxiv.org/abs/2609.03796','学習設計、6B拡散トランスフォーマー、作者ベンチ']])}</section>`, `<a href="#">公開範囲</a>`, 'llada-image')});

articles.push({id:'quantum-freefall',color:'#90a9ff',icon:icons.physics,date:'SEP 02',score:[82,94,89,42],title:'量子の波を「止めた側」と「落とした側」に分け、重力で生じる位相を直接測定',summary:'冷却したルビジウム原子の波を2経路に分け、一方を実験室に静止、もう一方を自由落下させて再結合。一般相対論の等価原理が量子の位相へ与える予測を低エネルギー領域で確認した。',kicker:'QUANTUM PHYSICS / GRAVITY',meta:'Science Advances · peer-reviewed · 2026-09-02',head:'自由落下する量子波が得る「位相」を直接測った',dek:'原子が落ちた距離だけを見るのではなく、量子波の進み具合の差を干渉で読み、重力と量子理論の接点を実験した。',prompt:'Science Advancesのquantum phase of free fall実験について、冷却ルビジウム、原子干渉計、静止経路と自由落下経路、位相の時間依存、等価原理との一致、何をまだ検証していないかを説明して。',
overview:wrap('overview',`<section class="section"><p class="lead"><strong>国際研究チームは、超低温のルビジウム原子が持つ量子波を二つに分け、一方を実験室に対して静止させ、もう一方を重力で自由落下させた後に再結合し、二つの波に生じた「進み具合の差」を測りました。</strong> 測定した差は、アインシュタインの${term('等価原理','重力を受ける状態と、加速する座標系を局所的に区別できないという一般相対論の基礎原理。','equivalence principle')}から量子波に予測される位相と数%の範囲で一致しました。</p><div class="en-grid"><div class="en-card"><strong>一つの原子波を「静止」と「自由落下」の二経路へ分ける</strong><p>経路を再び重ねたときの干渉模様から、目に見えない位相差を読みます。</p></div><div class="en-card"><strong>この実験は「量子重力理論を証明した」ものではない</strong><p>低エネルギーの原子実験で、既存の等価原理が量子の波の位相にも整合することを試した結果です。</p></div></div></section>`, `<a href="#qf-e">何を測った？</a>`, 'quantum-freefall'),
explain:wrap('explain',`<section class="section" id="qf-e"><h2>位置の差ではなく、波の「位相」の差を読みます</h2><p>量子力学では原子を波として扱えます。波には山と谷の周期があり、その周期のどこにいるかを${term('位相','波の周期の中で現在どの位置にいるかを表す量。二つの波の位相差は干渉模様として測れる。','phase')}と呼びます。研究は、原子波の一方を支え、もう一方を本当に落下させたとき、重力が二つの位相へどれだけ差を作るかを測りました。</p><p>使った装置は${term('原子干渉計','原子の量子波を複数経路へ分け、再び重ねて位相差を精密に測る装置。','atom interferometer')}です。測定された位相は自由落下時間の3乗に比例する予測と一致し、報道資料では理論値と2.5%以内の一致が示されています。</p></section>`, `<a href="#qf-e">位相</a>`, 'quantum-freefall'),
detail:wrap('detail',`<section class="section"><h2>「重力が量子である」と直接示したわけではありません</h2><p>この実験は、重力場中の量子物質波が一般相対論の等価原理と整合する位相を持つかを測ったものです。重力そのものを量子重ね合わせにしたり、二つの量子物体が重力で互いに絡み合うかを測ったものではありません。</p><p><span class="emph-caution">一般相対論と量子力学の統一理論を決定した実験でもありません。</span> ただし、「片方を静止・片方を自由落下」という新しい干渉計は、より重い量子物体や別の重力条件で境界を探すための装置として意味があります。</p>${sources([['査読論文の書誌・要旨','https://pubmed.ncbi.nlm.nih.gov/42685188/','Science Advances、DOI、著者、実験要旨'],['Ben-Gurion大学研究ポータル','https://cris.bgu.ac.il/en/publications/observation-of-the-quantum-phase-of-free-fall-and-the-consistency/','研究目的と論文への一次リンク']])}</section>`, `<a href="#">何を証明した？</a>`, 'quantum-freefall')});

articles.push({id:'acorn-reprogramming',color:'#8ee5a5',icon:icons.bio,date:'SEP 08',score:[80,94,91,50],title:'変態で細胞が大量に死ぬのではなく、別の役割へ「再設定」される証拠',summary:'ギボシムシ87,021細胞を5発生段階で追った研究では、幼生と成体で多くの細胞が別の転写状態へ移る一方、標識した幼生細胞が成体へ残った。大規模な細胞置換より再プログラムを支持する。',kicker:'DEVELOPMENTAL BIOLOGY / METAMORPHOSIS',meta:'Nature Communications · open access · 2026-09-08',head:'幼生の細胞が消えるだけでなく、成体の別状態へ作り替えられる',dek:'ギボシムシの変態を単一細胞RNA解析と細胞追跡で調べ、幼生と成体の体を構成する細胞状態の切り替えを示した。',prompt:'Schizocardium californicumの変態研究について、87021 cells、5 stages、12 cell classes、single-cell RNA-seq、EdU pulse-chase、転写状態の再プログラム、筋肉・中胚葉の例外、限界を説明して。',
overview:wrap('overview',`<section class="section"><p class="lead"><strong>スタンフォード大学などの研究チームは、海にすむギボシムシ「Schizocardium californicum」の幼生から成体への変態を、87,021個の細胞の遺伝子活動と細胞追跡で調べました。</strong> 幼生の神経や腸など多くの細胞は、同じ種類の成体細胞より「同じ幼生期の別組織」に近い遺伝子活動を示し、変態後には別の状態へ大きく切り替わりました。</p><div class="actual-media"><div class="media-label"><span>実物｜論文Figure 2の単一細胞地図</span><a href="https://www.nature.com/articles/s41467-026-77191-y#Fig2" target="_blank" rel="noopener">原図を見る ↗</a></div><a href="https://www.nature.com/articles/s41467-026-77191-y#Fig2" target="_blank" rel="noopener"><img src="https://media.springernature.com/full/springer-static/image/art%3A10.1038%2Fs41467-026-77191-y/MediaObjects/41467_2026_77191_Fig2_HTML.png" alt="ギボシムシの単一細胞RNA解析で得た細胞クラス地図" loading="lazy"></a><div class="media-caption"><strong>見る場所：</strong>細胞を遺伝子活動の近さで配置した地図と、神経・筋肉・腸など12クラスのマーカー。論文はCC BY 4.0です。</div></div><div class="en-grid"><div class="en-card"><strong>5発生段階で87,021細胞を解析</strong><p>早期幼生、後期幼生、変態中、早期幼体、後期幼体を比較しました。</p></div><div class="en-card"><strong>染色した幼生細胞が変態後も残る</strong><p>細胞が大量に死んで新しい細胞へ置換された、という説明だけでは合わない結果です。</p></div></div></section>`, `<a href="#ar-e">再プログラム</a>`, 'acorn-reprogramming'),
explain:wrap('explain',`<section class="section" id="ar-e"><h2>「同じ細胞種が成長した」でも「全部入れ替わった」でもありません</h2><p>研究は${term('単一細胞RNA解析','細胞を一つずつ分け、それぞれでどの遺伝子がどれだけ働いているかを測る方法。','single-cell RNA sequencing')}で、各発生段階の細胞を遺伝子活動の状態ごとに比較しました。多くの外胚葉・内胚葉系細胞は、幼生と成体で別の転写空間に分かれました。</p><p>さらに、分裂中の細胞へ取り込まれて長く残る${term('EdU標識','DNA合成中の細胞へ取り込まれる分子を使い、後の発生段階まで細胞系譜を追う方法。','EdU pulse-chase')}を変態前に入れたところ、標識細胞が幼体にも残りました。<span class="emph-proof">「細胞が残ったまま、遺伝子活動と役割を大幅に変える」という再プログラムの説明を支持します。</span></p></section>`, `<a href="#ar-e">細胞追跡</a>`, 'acorn-reprogramming'),
detail:wrap('detail',`<section class="section"><h2>すべての細胞が同じように変わるわけではありません</h2><p>解析では56クラスターを12の大きな細胞クラスへ整理しました。神経、表皮、内胚葉などは生活史段階ごとの差が大きい一方、筋肉と${term('中胚葉','筋肉、循環系など多くの内部組織へつながる胚発生上の細胞系統。','mesoderm')}は幼生と幼体で比較的似た転写状態を保ちました。</p><p><span class="emph-caution">RNAの状態が変わったことだけでは、各細胞が具体的にどの成人機能へ変わったかを完全には証明できません。</span> 論文自身も、今後は細胞プロファイルと機能実験を組み合わせて機構を確定する必要があるとしています。</p>${sources([['Nature Communications原論文','https://www.nature.com/articles/s41467-026-77191-y','87,021細胞、5段階、EdU追跡、Figure、方法、限界、CC BY 4.0'],['Stanford Report','https://news.stanford.edu/stories/2026/09/acorn-worms-cellular-reprogramming','研究者による平易な背景説明と実物写真']])}</section>`, `<a href="#">例外と限界</a>`, 'acorn-reprogramming')});

articles.push({id:'personality-genetics',color:'#ffc27a',icon:icons.bio,date:'SEP 02',score:[79,95,89,67],title:'100万人規模で「性格と遺伝子」の関係を再検証すると、単一遺伝子では説明できなかった',summary:'46コホート・最大114万人のBig Five研究で1,260の関連変異を特定。一般的な遺伝変異が説明する性格差は約4.8〜9.3%で、環境の影響が大きいことも改めて示した。',kicker:'BEHAVIOURAL GENETICS / PERSONALITY',meta:'Nature · open access · 2026-09-02',head:'100万人規模の性格ゲノム研究が示したのは、「性格遺伝子」ではなく小さな効果の集合',dek:'Big Fiveの5特性を46コホートで統合し、家族内解析まで使って遺伝的関連の頑健性と限界を調べた。',prompt:'Nature 2026のBig Five personality GWASについて、46 cohorts、最大1.14M、1260 variants、SNP heritability 4.8–9.3%、within-family GWAS、環境、因果推論の限界、祖先集団の偏りを説明して。',
overview:wrap('overview',`<section class="section"><p class="lead"><strong>Natureに掲載された国際研究は、46の研究集団から性格データとゲノム情報を統合し、Big Fiveの各特性について61万人〜114万人規模の関連解析を行いました。</strong> 研究は1,260個の主要な遺伝的関連を見つけましたが、一般的な遺伝変異が説明した性格差は約4.8〜9.3%で、「一つの遺伝子で性格が決まる」という結果ではありません。</p><div class="en-grid"><div class="en-card"><strong>1,260の関連変異のうち824が新規</strong><p>効果は多数の場所へ分散しており、一つ一つの変異が性格を決定するわけではありません。</p></div><div class="en-card"><strong>一般的な変異が説明する差は約4.8〜9.3%</strong><p>信頼性の高い性格尺度だけを見ると9.3〜13.3%へ上がります。それでも環境要因は大きく残ります。</p></div></div><div class="en-callout risk"><strong>個人のDNAから「あなたはこの性格」と精密に当てられる研究ではありません。</strong> 集団統計の関連を調べたもので、個人診断への利用とは距離があります。</div></section>`, `<a href="#pg-e">何が強い？</a>`, 'personality-genetics'),
explain:wrap('explain',`<section class="section" id="pg-e"><h2>家族の環境が似ている影響も切り分けようとしました</h2><p>${term('ゲノムワイド関連解析','ゲノム全体の多数の変異と、性格などの特徴との統計的な関連を調べる方法。','genome-wide association study / GWAS')}は大規模データに強い一方、地域、家族環境、集団構成が関連へ混ざる可能性があります。そこで研究は最大50,725人の家族内データも使い、兄弟姉妹など同じ家庭背景に近い比較を行いました。</p><p>その結果、性格との遺伝的関連は他の社会・行動特性に比べて共有家族環境による混同が小さいと報告されました。ただし「遺伝の影響が大きい」と「環境が重要でない」は別です。論文自身も、すべての方法で環境が性格差へ大きく寄与すると述べています。</p></section>`, `<a href="#pg-e">家族内解析</a>`, 'personality-genetics'),
detail:wrap('detail',`<section class="section"><h2>40〜60%という有名な遺伝率と、4.8〜9.3%は測っている範囲が違います</h2><p>今回の${term('SNP遺伝率','調べた一般的な一塩基変異の違いだけで、集団内の特徴差をどの程度統計的に説明できるかという割合。個人の運命を示す値ではない。','SNP heritability')}は、一般的な変異の加算効果を中心に測ります。一方、双生児・家系研究の40〜60%は、稀な変異や遺伝子間相互作用などを含む別の範囲を反映します。</p><p>参加者は主に欧州系に近いゲノムと、より小規模なアフリカ系に近いゲノムの集団です。<span class="emph-caution">世界中の全祖先集団へ同じ予測精度で一般化できるとは限りません。</span> また、${term('メンデル無作為化','遺伝変異を手がかりに因果方向を推定する統計手法。前提条件が崩れると因果推論も崩れる。','Mendelian randomization')}で示した「もっともらしい因果」は、別手法による追試が必要だと著者も明記しています。</p>${sources([['Nature原論文','https://www.nature.com/articles/s41586-026-10992-9','46コホート、1,260変異、家族内解析、遺伝率、因果分析、限界'],['Nature解説','https://www.nature.com/articles/d41586-026-02790-0','日常語での研究背景とFigure 1']])}</section>`, `<a href="#">遺伝率の意味</a>`, 'personality-genetics')});

articles.push({id:'sleep-cortex',color:'#82b8ff',icon:icons.neuro,date:'SEP 09',score:[83,95,90,55],title:'大脳皮質に、遠くの領域を同期させて睡眠を促す少数ニューロンが見つかった',summary:'マウスで、Sst-Chodlという非常に少ない抑制性ニューロンが広範囲へ長い軸索を伸ばし、活性化すると皮質同期と徐波睡眠が増えた。睡眠制御に皮質自身が能動的に関わる証拠。',kicker:'NEUROSCIENCE / SLEEP',meta:'Nature · open access · 2026-09-09',head:'少数の長距離抑制ニューロンが、大脳皮質を同期させて睡眠を促す',dek:'睡眠は脳深部の制御だけで起こるという単純な構図へ、大脳皮質側の能動的な回路を追加するマウス研究。',prompt:'Nature 2026のSst-Chodl long-range inhibitory neurons研究について、低覚醒時の活動、長距離軸索、optogenetic/chemogenetic activation、slow-wave sleep、マウス実験、ヒト一般化の限界を説明して。',
overview:wrap('overview',`<section class="section"><p class="lead"><strong>Natureに掲載されたマウス研究は、大脳皮質にある非常に少数の「Sst-Chodl」抑制性ニューロンが、遠く離れた皮質領域へ長い軸索を伸ばし、低覚醒状態で活動することを示しました。</strong> 研究者がこの細胞群を人為的に活性化すると、複数の皮質領域の低周波活動がそろい、徐波睡眠が増えました。</p><div class="en-grid"><div class="en-card"><strong>少数でも複数領域へ同時に長距離投射</strong><p>一般的な皮質抑制ニューロンより広い範囲へ影響できる構造を持ちます。</p></div><div class="en-card"><strong>活性化すると暗期でも徐波睡眠が増加</strong><p>マウスが本来よく活動する時間帯でも、睡眠時間と皮質同期が増えました。</p></div></div><div class="en-callout warn"><strong>マウスの回路研究です。</strong> 人間の不眠治療法ができた、特定のニューロンを刺激すれば安全に眠れる、という臨床結果ではありません。</div></section>`, `<a href="#sc-e">皮質の役割</a>`, 'sleep-cortex'),
explain:wrap('explain',`<section class="section" id="sc-e"><h2>睡眠を「脳深部から皮質へ送る命令」だけで説明しにくくなります</h2><p>従来の睡眠研究では、視床下部や脳幹など${term('皮質下領域','大脳皮質より深部にある脳領域の総称。睡眠・覚醒、情動、自律機能などへ強く関わる。','subcortical regions')}の役割が特に重視されてきました。今回の研究は、大脳皮質の回路自身にも睡眠状態を押し進める細胞があることを示します。</p><p>${term('Sst-Chodl細胞','ソマトスタチンとchondrolectinを共発現する、非常に少数のGABA作動性抑制ニューロン。','Sst-Chodl neurons')}は静かな覚醒や徐波睡眠で活動し、深い皮質層を強く抑制します。遠くまで伸びた軸索が複数領域を同時に抑えることで、低周波のリズムをそろえる機構が考えられます。</p></section>`, `<a href="#sc-e">同期の仕組み</a>`, 'sleep-cortex'),
detail:wrap('detail',`<section class="section"><h2>相関だけでなく、細胞を操作して睡眠への因果効果を調べました</h2><p>研究は遺伝的にSst-Chodl細胞を選択し、二光子イメージング、電気生理、${term('光遺伝学','光で特定の神経細胞を活動・抑制させる実験法。','optogenetics')}、薬で設計受容体を刺激する${term('化学遺伝学','特定細胞へ人工受容体を発現させ、薬剤で選択的に活動を変える実験法。','chemogenetics')}を組み合わせました。</p><p>全皮質で化学遺伝学的に活性化した実験では、明期・暗期の双方で徐波睡眠が増え、対照マウスでは薬だけによる同じ変化は見られませんでした。<span class="emph-proof">「睡眠中に活動していた」だけでなく、活性化すると睡眠が増えたため、因果方向を一段強く検証しています。</span></p><p><span class="emph-caution">それでも種差、人工的な広範囲刺激、長期的副作用は別問題です。</span> 人で同じ細胞群を安全に標的化できるかは、この研究だけでは分かりません。</p>${sources([['Nature原論文','https://www.nature.com/articles/s41586-026-10876-y','回路構造、活動記録、細胞操作、睡眠量、統計、コード、CC BY 4.0']])}</section>`, `<a href="#">因果実験</a>`, 'sleep-cortex')});

articles.push({id:'codex-quota-watch',color:'#ffb76b',icon:icons.watch,date:'SEP 09–11',score:[75,72,70,99],title:'Codex利用枠が「別の古い週次状態」へ切り替わる報告が複数アカウントで一致',summary:'9月9〜11日、週次残量とリセット日時が同時に大きく変わって元へ戻る報告が複数発生。ローカルのHTTPヘッダーでも別状態が確認されており、単なる画面キャッシュでは説明しにくい。次回リセットの予告とは判断できない。',kicker:'CODEX WATCH / USAGE ACCOUNTING',meta:'weak-signal watch · reports 2026-09-09 to 11',head:'Codex利用枠で、週次の「別状態」へ切り替わって戻る報告が集中',dek:'複数の利用者が、残量とリセット日時の組み合わせごと別の値へ切り替わり、その後ほぼ元へ戻る挙動を記録している。',prompt:'2026年9月のCodex quota oscillation issuesについて、複数issueの共通パターン、HTTP header evidence、banked/global resetとの関係、何が確定していて何が推測か、次回リセット予兆と言えるかを整理して。',
overview:wrap('overview',`<section class="section"><p class="lead"><strong>9月9〜11日に、OpenAIのコーディングAIであるCodexで、週次利用枠の残量とリセット日時がセットで別の状態へ切り替わり、その後に元へ近い状態へ戻る報告が複数の独立アカウントから出ています。</strong> 一部の利用者はアプリ画面だけでなく、ローカル記録に含まれるサーバー返答ヘッダーでも切り替わりを確認しています。</p><div class="en-grid"><div class="en-card"><strong>32%使用・9/15リセット → 46%使用・9/12 → 元へ復帰</strong><p>28〜34秒単位で二つの週次状態を行き来した報告があります。</p></div><div class="en-card"><strong>39%残り・9/15 → 75%残り・9/14 → 38%残り・9/15</strong><p>Web表示でも同じ一時状態が見え、その後ほぼ元の値へ戻った別報告です。</p></div></div><div class="en-callout risk"><strong>これは「次の無料リセットが近い」という証拠ではありません。</strong> 現時点で最も直接的に言えるのは、サーバー側の利用量計算・利用枠状態の同期または帳簿選択に不整合らしい挙動が複数報告されていることです。</div></section>`, `<a href="#cq-e">共通点</a>`, 'codex-quota-watch'),
explain:wrap('explain',`<section class="section" id="cq-e"><h2>残量だけでなく、リセット日時も一緒に切り替わるのが特徴です</h2><p>通常の利用で残量が減るだけなら、同じ週次窓の中で数値だけが動きます。今回の報告では「残量」と「週次リセット日時」の組み合わせそのものが別の組へ変わり、その後戻る例があります。ある報告では${term('HTTPレスポンスヘッダー','サーバーが通信応答へ付ける補助情報。利用枠やリセット時刻などが含まれる場合がある。','HTTP response headers')}に二つの状態が記録されました。</p><p>OpenAI公式ヘルプは、9月3日と4日に対象アカウントへ保存可能なリセットを付与し、9月7日にPlus・Pro・Businessへ即時適用の全体リセットを行ったと説明しています。保存リセットを使った場合は、短時間枠と週次枠が更新され、週次リセット日時も変わる仕様です。今回の不整合報告の一部は、その前後の古い状態が再び見える形になっています。</p></section>`, `<a href="#cq-e">なぜ怪しい？</a>`, 'codex-quota-watch'),
detail:wrap('detail',`<section class="section"><h2>確定していることと、推測を分けます</h2><table class="en-table"><tr><th>確度</th><th>現時点で言えること</th></tr><tr><td><span class="emph-proof">確認済み</span></td><td>複数の独立Issueで、残量とリセット日時が同時に大きく変わり、戻る例が報告されている。一部はWebとアプリ、またはローカル通信記録の双方で一致。</td></tr><tr><td><span class="emph-caution">かなり有力</span></td><td>単純な表示キャッシュだけではなく、サーバー側の利用枠状態または同期が関与している。</td></tr><tr><td><span class="emph-risk">未確定</span></td><td>根本原因が保存リセット、9月7日の全体リセット、複数帳簿の切り替え、計測遅延のどれか。OpenAIはIssue群で根本原因を公表していない。</td></tr><tr><td><span class="emph-risk">根拠なし</span></td><td>近く新しい全体リセットが来る、利用枠が恒久的に増える、という予測。</td></tr></table><p>したがってWatchとして有用なのは、「急な残量変化が出たときに一度の表示だけで判断せず、リセット日時と複数の画面・CLI状態も一緒に記録する」ことです。新しいリセットの予兆として使うのは現時点では不適切です。</p>${sources([['OpenAI公式ヘルプ','https://help.openai.com/en/articles/20001498-how-banked-codex-resets-work','9月3・4日の保存リセット、9月7日の全体リセット、正常時の仕様'],['Issue #44251','https://github.com/openai/codex/issues/44251','HTTPヘッダーで二つの週次状態を確認した詳細記録'],['Issue #44245','https://github.com/openai/codex/issues/44245','39→75→38%と9/15→9/14→9/15の復帰例'],['Issue #44262','https://github.com/openai/codex/issues/44262','別アカウント・別端末でも一時的な週次状態変更を確認']])}</section>`, `<a href="#">確度</a>`, 'codex-quota-watch')});

const az=document.getElementById('agentzero');
if(az&&!az.querySelector('[data-memory-update="sep16"]')){
 const main=az.querySelector('[data-mode-panel="detail"] .mode-main');
 const fb=main?.querySelector('.feedback');
 if(main&&fb)fb.insertAdjacentHTML('beforebegin',`<section class="section" data-memory-update="sep16"><div class="update-box"><div class="u-kicker">UPDATE · SEP 16</div><h3>記憶は「検索できること」だけでなく、検索してよいかを判定する必要がある</h3><p>2026年6月の${term('MemGate','長期記憶候補を大規模言語モデルへ渡す前に、その記憶を今回のタスクへ入れてよいかを軽量モデルで判定する研究。','MemGate')}研究は、意味が似ている記憶でも、別の文脈の個人情報、迎合を誘う過去発言、道具操作をずらす記憶、記憶経由の命令注入になり得ると整理しました。</p></div><p>MemGateは900万パラメータ、35.1MBの小型ゲートをベクトル検索と本体AIの間へ置き、今回の質問に対して通すべき記憶だけを選びます。データベースを書き換えたり、回答時に別の大型AIを審判として呼ぶ必要はありません。</p><p>同じ時期の${term('MemMachine','会話を短い事実へ削りすぎず、会話エピソード全体を保存して周辺文脈ごと検索する長期記憶システム。','MemMachine')}は、要約・抽出で原文を失う問題へ別方向から取り組みます。さらに${term('MemX','RustとlibSQLで動くローカル優先の長期記憶システム。ベクトル検索と単語検索を融合し、低信頼候補を拒否する。','MemX')}は、ローカル保存と「確信が低ければ何も返さない」設計を重視しています。</p><div class="en-callout proof"><strong>この3研究をAgent Zero Memoryと合わせると、設計原則がかなり明確になります。</strong> 元証拠を残す、記憶の種類を分ける、検索した候補を無条件に注入しない、確信が低い検索結果は捨てる、という4段階です。</div>${sources([['MemGate原論文','https://arxiv.org/abs/2606.06054','記憶検索を信頼境界として扱う脅威モデルと軽量ゲート'],['MemMachine原論文','https://arxiv.org/abs/2604.04853','会話エピソード全体の保存と文脈付き検索'],['MemX原論文','https://arxiv.org/abs/2603.16171','ローカル優先、ハイブリッド検索、低信頼拒否、LongMemEval評価']])}</section>`);
}
