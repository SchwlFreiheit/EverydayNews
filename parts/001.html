<!doctype html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RADAR — real issue v16</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter+Tight:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700;800&family=Shippori+Mincho:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#090a0b;--surface:#101214;--surface2:#15181a;--surface3:#1b1f21;--ink:#f3efe7;--body:#d8d4ca;--sub:#aaa9a3;--muted:#777d79;--line:#2b3032;--link:#8db9ff;--lime:#d5ff66;--cyan:#70d9ef;--violet:#b39cff;--amber:#ffb35a;--rose:#ff7e83;--mint:#7ce7bd;--display:"Inter Tight","Noto Sans JP",system-ui,sans-serif;--text:"Noto Sans JP",system-ui,sans-serif;--serif:"Shippori Mincho",serif;--mono:"IBM Plex Mono",monospace;--shadow:0 30px 80px rgba(0,0,0,.38)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-feature-settings:"palt" 1,"kern" 1;min-height:100vh}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:var(--link);text-underline-offset:3px}.hidden{display:none!important}
/* home = v6-style */
.shell{max-width:1480px;margin:auto;padding:18px 28px 84px}.topbar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:4px 0 14px}.brand{display:flex;align-items:baseline;gap:14px}.brand strong{font:800 31px/1 var(--display);letter-spacing:-.06em}.brand span{font:600 10px/1 var(--mono);letter-spacing:.14em;color:var(--muted)}.issuebar{display:flex;justify-content:space-between;gap:20px;margin:12px 0 19px;color:var(--muted);font:600 10px var(--mono);letter-spacing:.05em}.feed{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.story{--accent:var(--lime);position:relative;min-height:315px;padding:20px 20px 18px;background:var(--surface);border:1px solid transparent;border-top-color:var(--line);text-align:left;overflow:hidden;transition:.18s ease}.story:hover{background:var(--surface2);border-color:color-mix(in srgb,var(--accent) 35%,var(--line));transform:translateY(-2px)}.story:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--accent)}.story-top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}.meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font:600 10px var(--mono);letter-spacing:.08em}.story h2{margin:49px 0 12px;font:800 clamp(42px,4.8vw,70px)/.95 var(--display);letter-spacing:-.055em}.story p{margin:0;max-width:650px;color:var(--sub);font-size:14px;line-height:1.72}.story .rank{position:absolute;right:18px;bottom:0;font:800 72px/.9 var(--display);letter-spacing:-.08em;color:color-mix(in srgb,var(--ink) 7%,transparent)}.state{position:absolute;left:20px;bottom:17px;display:flex;gap:6px}.state-chip{border:1px solid var(--line);border-radius:999px;padding:4px 8px;color:var(--muted);font:650 9px var(--display)}.state-chip.deep{border-color:color-mix(in srgb,var(--violet) 45%,var(--line));color:var(--violet)}
.rings{display:flex;gap:7px;align-items:center}.ring{--v:50;--c:var(--lime);width:33px;height:33px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--c) calc(var(--v)*1%),var(--line) 0);flex:0 0 auto}.ring:before{content:"";position:absolute;inset:3px;background:var(--surface);border-radius:50%}.ring svg{position:relative;z-index:1;width:13px;height:13px;color:var(--sub)}.ring:hover:after{content:attr(data-label) "  " attr(data-value);position:absolute;top:39px;right:0;z-index:90;background:var(--ink);color:var(--bg);padding:5px 7px;border-radius:5px;font:700 10px var(--display);white-space:nowrap}
/* candidates */
.candidates{margin-top:26px;border-top:1px solid var(--line);padding-top:18px}.cand-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:9px}.cand-head h3{margin:0;font:800 17px var(--display)}.cand-head span{color:var(--muted);font:600 10px var(--mono)}.cand-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line)}.candidate{padding:14px 14px 13px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:130px}.candidate:nth-child(2n){border-right:0}.candidate .cmeta{font:600 9px var(--mono);letter-spacing:.08em;color:var(--muted)}.candidate h4{margin:10px 0 6px;font:800 18px/1.25 var(--display);letter-spacing:-.025em}.candidate p{margin:0;color:var(--muted);font-size:12px;line-height:1.65}.candidate-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}.cand-dots{display:flex;gap:6px}.cand-dot{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:transparent}.cand-dot.active{background:var(--lime);border-color:var(--lime)}.cand-next{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 9px;color:var(--muted);font:650 10px var(--display)}.cand-next.active{color:var(--bg);background:var(--lime);border-color:var(--lime)}
/* overlay */
.overlay{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;overflow:auto}.overlay.open{display:block}.article-shell{max-width:1500px;margin:auto;padding:14px 28px 110px}.article-nav{position:sticky;top:0;z-index:80;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding:8px 0 10px;background:color-mix(in srgb,var(--bg) 93%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.nav-left{display:flex;align-items:center;gap:12px}.nav-left strong{font:800 14px var(--display)}.nav-left span{font:600 9px var(--mono);letter-spacing:.08em;color:var(--muted)}.close{justify-self:end;width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:transparent;font-size:22px}.close:hover{background:var(--surface2)}.depth-switch{justify-self:center;display:flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.depth-switch button{border:0;background:transparent;color:var(--muted);border-radius:999px;padding:8px 15px;font:650 12px var(--display)}.depth-switch button.active{background:var(--ink);color:var(--bg)}.reading-progress{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--line)}.reading-progress i{display:block;width:0;height:100%;background:var(--article-accent,var(--lime))}
.article-head{display:grid;grid-template-columns:minmax(0,1.15fr) 330px;gap:48px;padding:40px 0 34px;border-bottom:1px solid var(--line)}.article-kicker{color:var(--article-accent);font:700 10px var(--mono);letter-spacing:.12em;margin-bottom:14px}.article-head h1{margin:0;font:800 clamp(48px,6vw,78px)/.94 var(--display);letter-spacing:-.055em}.article-head .dek{margin:22px 0 0;max-width:870px;color:var(--sub);font-size:18px;line-height:1.75}.article-aside{align-self:end}.article-aside .rings{margin-bottom:15px}.article-actions{display:flex;flex-wrap:wrap;gap:7px}.article-actions button{border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:999px;padding:8px 11px;font:650 10px var(--display)}.article-actions button.active{background:var(--surface2);color:var(--ink)}.article-actions .deep{border-color:color-mix(in srgb,var(--violet) 45%,var(--line));color:var(--violet)}
.mode-panel{display:none}.mode-panel.active{display:block}.mode-layout{display:grid;grid-template-columns:minmax(0,960px) 250px;justify-content:center;gap:70px;padding-top:34px}.mode-main{min-width:0}.toc{position:sticky;top:86px;align-self:start}.toc h4{margin:0 0 13px;color:var(--muted);font:700 10px var(--mono);letter-spacing:.12em}.toc a{display:block;padding:8px 0 8px 12px;border-left:1px solid var(--line);color:var(--muted);text-decoration:none;font-size:13px}.toc a:hover{color:var(--ink)}.toc .hint{margin-top:16px;color:var(--muted);font-size:12px;line-height:1.65}.section{scroll-margin-top:90px;padding:56px 0;border-top:1px solid var(--line)}.section:first-child{border-top:0;padding-top:8px}.section h2{margin:0 0 22px;font:800 22px/1.15 var(--display);letter-spacing:-.02em}.section p{margin:0 0 1.05em;color:var(--body);font-size:17px;line-height:2}.section .lead{font:600 24px/1.72 var(--serif);color:var(--ink);margin-bottom:28px}.section .secondary{color:var(--sub);font-size:15px}.detail .section p{font-size:18px;line-height:2.05}.detail .section .lead{font-size:26px}.detail .section{padding:62px 0}.key{font-weight:800}.term{border-bottom:1px dotted currentColor;cursor:help}.mono{font-family:var(--mono)}
/* visual rules: minimum readable labels */
.visual{margin:28px 0 36px;border:1px solid var(--line);background:var(--surface)}.visual-title{padding:11px 15px;border-bottom:1px solid var(--line);color:var(--muted);font:700 12px var(--mono);letter-spacing:.05em}.visual-body{padding:24px}.caption{color:var(--muted);font-size:14px;line-height:1.65;margin-top:12px}.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:13px;color:var(--sub)}
/* Funes */
.memory-bridge{display:grid;grid-template-columns:1fr 100px 1fr;gap:18px;align-items:center}.memory-stack{display:grid;gap:10px}.memory-card{padding:15px 16px;border:1px solid var(--line);background:var(--surface2);font-size:15px;line-height:1.55}.memory-card strong{display:block;color:var(--ink);margin-bottom:4px}.memory-card.selected{border-color:color-mix(in srgb,var(--lime) 55%,var(--line));box-shadow:inset 4px 0 0 var(--lime)}.bridge-mid{text-align:center}.bridge-mid .orb{width:64px;height:64px;border-radius:50%;border:1px solid color-mix(in srgb,var(--lime) 45%,var(--line));display:grid;place-items:center;margin:auto;color:var(--lime);font-size:26px}.bridge-mid span{display:block;margin-top:8px;color:var(--muted);font-size:13px}.compare-bars{display:grid;gap:18px}.bar-row{display:grid;grid-template-columns:220px 1fr 120px;gap:16px;align-items:center}.bar-row .name{font-size:15px;color:var(--body)}.bar-track{height:18px;border-radius:999px;background:#22272a;overflow:hidden}.bar-fill{height:100%;width:var(--w);background:var(--article-accent);border-radius:inherit}.bar-row .value{font:600 13px var(--mono);color:var(--sub);text-align:right}.search-pipeline{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.search-pipeline>div{padding:15px;border:1px solid var(--line);background:var(--surface2);font-size:14px;line-height:1.55;position:relative}.search-pipeline>div:not(:last-child):after{content:"→";position:absolute;right:-14px;top:50%;transform:translateY(-50%);color:var(--muted);z-index:2}.search-pipeline b{display:block;color:var(--ink);margin-bottom:5px}
/* Voice */
.live-demo{padding:26px}.wave{height:58px;display:flex;align-items:center;gap:5px;margin-bottom:24px}.wave i{width:6px;height:var(--h);border-radius:99px;background:var(--cyan);opacity:.78}.transcript{display:grid;gap:14px}.utterance{display:grid;grid-template-columns:94px 1fr;gap:15px;align-items:start}.speaker{font:700 13px var(--mono);padding-top:4px}.speaker.a{color:var(--cyan)}.speaker.b{color:var(--violet)}.utterance p{margin:0!important;font-size:17px!important;line-height:1.75!important}.method-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.method-pair>div{border:1px solid var(--line);background:var(--surface);padding:20px}.method-pair h3{margin:0 0 10px;font-size:18px}.method-pair p{font-size:15px!important;line-height:1.8!important}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}.stat{background:var(--surface);padding:20px}.stat strong{display:block;font:700 28px/1.1 var(--display);color:var(--ink)}.stat span{display:block;margin-top:8px;color:var(--sub);font-size:14px;line-height:1.55}
/* Ruby */
.evidence-stack{display:grid;gap:10px}.evidence-row{display:grid;grid-template-columns:170px 1fr;gap:18px;padding:17px 0;border-top:1px solid var(--line)}.evidence-row:first-child{border-top:0}.evidence-row b{font:800 15px var(--display)}.evidence-row p{margin:0!important;font-size:16px!important;line-height:1.8!important}.confirmed b{color:var(--mint)}.attributed b{color:var(--amber)}.unknown b{color:var(--rose)}.timeline{position:relative;padding-left:34px}.timeline:before{content:"";position:absolute;left:9px;top:8px;bottom:8px;width:1px;background:var(--line)}.event{position:relative;padding:0 0 28px}.event:before{content:"";position:absolute;left:-31px;top:7px;width:11px;height:11px;border-radius:50%;background:var(--article-accent);box-shadow:0 0 0 5px var(--bg)}.event b{display:block;color:var(--muted);font:600 12px var(--mono);margin-bottom:5px}.event p{font-size:16px!important;line-height:1.8!important}
/* Space */
.space-hero{min-height:430px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(9,10,11,.02),rgba(9,10,11,.16) 45%,rgba(9,10,11,.88)),url('https://www.chandra.si.edu/photo/2026/m101/m101.jpg') center/cover;position:relative}.space-hero .space-caption{position:absolute;left:24px;right:24px;bottom:20px}.space-hero .space-caption strong{display:block;font:800 34px var(--display)}.space-hero .space-caption span{font-size:14px;line-height:1.6;color:#d2d5d9}.spectrum{display:grid;grid-template-columns:1fr 1.2fr 1.3fr 1.5fr;height:92px;border:1px solid var(--line);overflow:hidden}.spectrum>div{display:grid;place-items:center;text-align:center;font:700 14px/1.35 var(--display);color:#fff;padding:8px}.uv{background:#4c4aa1}.euv{background:#a14eb0}.softx{background:#2d85b7}.hardx{background:#174968}.spectrum .blind{outline:4px solid var(--amber);outline-offset:-4px}.space-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.space-fact{padding:18px;border-top:2px solid var(--line);background:var(--surface)}.space-fact strong{display:block;font:700 28px var(--display)}.space-fact span{display:block;color:var(--sub);font-size:14px;line-height:1.55;margin-top:5px}
/* notes sources feedback */
.note{margin:28px 0;padding:18px 20px;background:var(--surface);border-left:3px solid var(--article-accent);font-size:15px;line-height:1.85;color:var(--body)}.note.warn{border-left-color:var(--rose)}.note b{color:var(--ink)}.source-list{margin-top:30px}.source{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}.source b{display:block;font-size:14px}.source span{font-size:13px;color:var(--muted)}.source a{font:700 12px var(--display)}.feedback{margin-top:42px;padding-top:26px;border-top:1px solid var(--line)}.feedback h3{margin:0 0 14px;font:800 18px var(--display)}.feedback-row{display:flex;justify-content:space-between;gap:20px;align-items:center}.interest{display:flex;align-items:center;gap:10px}.interest>span{font-size:12px;color:var(--muted)}.dots{display:flex;gap:8px}.dot{width:29px;height:29px;border-radius:50%;border:1px solid var(--line);background:transparent}.dot.active{background:var(--article-accent);border-color:var(--article-accent)}.feedback-actions{display:flex;gap:7px;flex-wrap:wrap}.feedback-actions button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 11px;color:var(--sub);font:650 11px var(--display)}.feedback-actions button.active{background:var(--surface2);color:var(--ink)}
.term-pop{position:fixed;z-index:310;max-width:370px;background:var(--ink);color:var(--bg);padding:13px 14px;border-radius:9px;box-shadow:var(--shadow);display:none}.term-pop.open{display:block}.term-pop b{display:block;font:800 13px var(--display);margin-bottom:6px}.term-pop p{margin:0;font-size:13px;line-height:1.7}.term-pop small{display:block;margin-top:7px;opacity:.62;font:600 10px var(--mono)}.term-actions{display:flex;gap:6px;margin-top:10px}.term-actions button{border:1px solid rgba(0,0,0,.18);background:transparent;border-radius:999px;padding:6px 8px;font:700 10px var(--display)}.toast{position:fixed;left:50%;bottom:24px;z-index:500;transform:translate(-50%,18px);opacity:0;background:var(--ink);color:var(--bg);padding:9px 12px;border-radius:7px;font:700 11px var(--display);transition:.18s}.toast.show{opacity:1;transform:translate(-50%,0)}
.deep-modal{position:fixed;inset:0;z-index:260;display:none;place-items:center;padding:20px;background:rgba(0,0,0,.58)}.deep-modal.open{display:grid}.deep-card{width:min(650px,100%);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);padding:22px}.deep-card h3{margin:0 0 8px;font:800 23px var(--display)}.deep-card p{color:var(--sub);font-size:13px;line-height:1.7}.focuses{display:flex;gap:7px;flex-wrap:wrap}.focuses button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 11px;color:var(--sub);font:650 11px var(--display)}.focuses button.active{border-color:var(--violet);color:var(--violet)}.deep-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.deep-actions button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:9px 13px;font:700 11px var(--display)}.deep-actions .primary{background:var(--violet);color:#111;border-color:var(--violet)}
.kw-memory{color:var(--lime)}.kw-search{color:var(--cyan)}.kw-risk{color:var(--rose)}.kw-speaker{color:var(--violet)}.kw-evidence{color:var(--mint)}.kw-xray{color:var(--cyan)}.kw-euv{color:var(--violet)}.kw-agent{color:var(--amber)}

/* v16: semantic emphasis — color/weight only when it carries meaning */
.emph-core{font-family:var(--display);font-weight:800;color:var(--ink)}
.emph-accent{font-family:var(--display);font-weight:800;color:var(--article-accent);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.22em;text-decoration-color:color-mix(in srgb,var(--article-accent) 45%,transparent)}
.emph-proof{font-weight:800;color:var(--mint)}
.emph-caution{font-weight:750;color:var(--amber)}
.emph-risk{font-weight:800;color:var(--rose)}
.emph-concept{font-family:var(--serif);font-weight:700;color:color-mix(in srgb,var(--article-accent) 78%,var(--ink))}
.visual-title{font-size:14px;letter-spacing:.025em;color:var(--sub)}
.caption{font-size:15px}
.search-pipeline>div{font-size:15px;line-height:1.65}
