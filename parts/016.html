<style>
/* 2026-09-16 corrective UI pass */
.feed .story{min-height:270px!important;padding:20px 22px 18px!important}
.feed .story h2{margin:34px 0 11px!important;font-size:clamp(27px,2.35vw,38px)!important;line-height:1.08!important;letter-spacing:-.035em!important}
.feed .story p{font-size:15px!important;line-height:1.72!important;max-width:720px!important}
.feed .story .rank{font-size:46px!important;opacity:.62!important}
.meta{align-items:center!important;min-height:30px}.meta .genre-icon{width:28px;height:28px;border:1px solid color-mix(in srgb,var(--accent) 38%,var(--line));border-radius:8px;display:inline-grid;place-items:center;color:var(--accent);background:color-mix(in srgb,var(--accent) 5%,var(--surface2));flex:0 0 auto}.meta .genre-icon svg{width:18px;height:18px;display:block}.meta .genre-date{font:650 10px/1 var(--mono);letter-spacing:.07em;color:var(--muted)}
.candidate .cmeta{display:flex!important;align-items:center;gap:9px!important}.candidate .genre-icon{width:25px;height:25px;border:1px solid var(--line);border-radius:7px;display:inline-grid;place-items:center;color:var(--sub);flex:0 0 auto}.candidate .genre-icon svg{width:16px;height:16px}.candidate .genre-rest{font:650 10px/1.35 var(--mono);letter-spacing:.05em;color:var(--muted)}
.overlay .article-head h1{font-size:clamp(36px,3.65vw,44px)!important;line-height:1.08!important;letter-spacing:-.028em!important}
.overlay .article-head .dek{font-size:18px!important;line-height:1.82!important}.overlay .section h2{font-size:24px!important;line-height:1.35!important;color:color-mix(in srgb,var(--article-accent) 78%,var(--ink))!important}.overlay .section h3{font-size:21px!important;line-height:1.4!important}.overlay .section .lead,.overlay .overview-intro,.qa-overview .qa-first{font-size:20px!important;line-height:1.82!important}
.overlay .term{color:color-mix(in srgb,var(--article-accent) 82%,#fff)!important;font-weight:760!important;border-bottom:1px dotted color-mix(in srgb,var(--article-accent) 72%,transparent)!important;background:color-mix(in srgb,var(--article-accent) 5%,transparent);padding:0 .08em;border-radius:3px}.overlay .term:hover{background:color-mix(in srgb,var(--article-accent) 12%,transparent)}
.overlay .mode-panel[data-mode-panel="explain"] .section strong,.overlay .mode-panel[data-mode-panel="detail"] .section strong{color:color-mix(in srgb,var(--article-accent) 70%,var(--ink))}.overlay .mode-panel[data-mode-panel="explain"] .source b,.overlay .mode-panel[data-mode-panel="detail"] .source b{color:var(--cyan)!important}.overlay .mode-panel[data-mode-panel="explain"] .note b,.overlay .mode-panel[data-mode-panel="detail"] .note b{color:var(--mint)!important}
.overlay .emph-proof,.overlay .qa-proof{color:var(--mint)!important}.overlay .emph-caution,.overlay .qa-warn{color:var(--amber)!important}.overlay .emph-risk,.overlay .qa-risk{color:var(--rose)!important}.overlay .key,.overlay .qa-key,.overlay .emph-accent{color:var(--article-accent)!important}
.overlay .fact-cell b,.overlay .chem-fact b,.overlay .stat strong,.overlay .space-fact strong{font-size:17px!important;line-height:1.5!important}.overlay .fact-cell span,.overlay .chem-fact span,.overlay .stat span,.overlay .space-fact span{font-size:16px!important;line-height:1.78!important}
@media(max-width:900px){.feed .story h2{font-size:30px!important}.overlay .article-head h1{font-size:38px!important}}
</style>
<script>
(()=>{
const svg=(body)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
const ICONS={
 ai:svg('<circle cx="6" cy="12" r="2.2"/><circle cx="18" cy="6" r="2.2"/><circle cx="18" cy="18" r="2.2"/><path d="M8 11l7.8-4M8 13l7.8 4M18 8.2v7.6"/>'),
 audio:svg('<path d="M3 12h2l2-6 3 12 3-15 3 12 2-6 3 3"/>'),
 security:svg('<path d="M12 3 5 6v5c0 4.7 2.8 8 7 10 4.2-2 7-5.3 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-5"/>'),
 space:svg('<circle cx="12" cy="12" r="3"/><path d="M3 12c3-5 15-7 18-2 2 4-5 8-11 9-4 .5-7-1-7-3"/><path d="m18.5 4 .6 1.6 1.6.6-1.6.6-.6 1.6-.6-1.6-1.6-.6 1.6-.6.6-1.6Z"/>'),
 neuro:svg('<path d="M9 4a3 3 0 0 0-3 3v1a3 3 0 0 0-2 3c0 1.3.8 2.5 2 3v1a3 3 0 0 0 3 3c1.3 0 2.4-.8 3-1.8V6A3 3 0 0 0 9 4Z"/><path d="M15 4a3 3 0 0 1 3 3v1a3 3 0 0 1 2 3c0 1.3-.8 2.5-2 3v1a3 3 0 0 1-3 3c-1.3 0-2.4-.8-3-1.8V6A3 3 0 0 1 15 4Z"/><path d="M8 9h2M14 9h2M8 14h2M14 14h2"/>'),
 chemistry:svg('<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9V3"/><path d="M7.5 16h9"/>'),
 robot:svg('<rect x="5" y="7" width="14" height="11" rx="3"/><path d="M12 3v4M8.5 12h.01M15.5 12h.01M9 16h6M3 11v4M21 11v4"/>'),
 chip:svg('<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 9h6v6H9zM9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>'),
 default:svg('<circle cx="12" cy="12" r="8"/><path d="M8 12h8M12 8v8"/>')
};
function kind(raw){const s=(raw||'').toUpperCase();if(/AUDIO|VOICE|SPEECH/.test(s))return'audio';if(/SECURITY|ZERO-TRUST|AUDIT/.test(s))return'security';if(/ASTRON|SPACE|COSMO|PLANET/.test(s))return'space';if(/BCI|NEURO|BRAIN/.test(s))return'neuro';if(/CHEM|SYNTHESIS|MATERIAL/.test(s))return'chemistry';if(/ROBOT/.test(s))return'robot';if(/SEMICONDUCTOR|CHIP|HBM|HARDWARE/.test(s))return'chip';if(/AI|AGENT|MEMORY|MCP|LLM/.test(s))return'ai';return'default'}
function decorateGenres(){
 document.querySelectorAll('.story').forEach(story=>{const meta=story.querySelector('.meta');if(!meta)return;const first=meta.querySelector('span:first-child');if(!first||first.classList.contains('genre-icon'))return;const raw=first.textContent.trim();first.className='genre-icon';first.innerHTML=ICONS[kind(raw)];first.title=raw;first.setAttribute('aria-label',raw);const date=meta.querySelector('span:nth-child(2)');if(date)date.classList.add('genre-date')});
 document.querySelectorAll('.candidate .cmeta').forEach(el=>{if(el.dataset.iconized==='1')return;const raw=el.textContent.trim();const bits=raw.split('·');const genre=bits.shift().trim();const rest=bits.join('·').trim();el.innerHTML=`<span class="genre-icon" title="${genre.replace(/"/g,'&quot;')}" aria-label="${genre.replace(/"/g,'&quot;')}">${ICONS[kind(genre)]}</span>${rest?`<span class="genre-rest">${rest}</span>`:''}`;el.dataset.iconized='1'});
 const head=document.querySelector('.cand-head');if(head){const h=head.querySelector('h3');const s=head.querySelector('span');if(h)h.textContent='記事化待ち';if(s)s.textContent='検証できたものは全て本記事へ昇格';}
}
const scoreFix={funes:[82,68,73,96],voice:[73,70,82,68],ruby:[87,79,90,61],space:[66,92,84,47],agentzero:[81,63,86,95],wild:[68,94,88,42],'bci-multi':[78,96,91,56],solpi:[91,74,94,99],'reaction-hyperspace':[72,97,96,45]};
for(const [id,v] of Object.entries(scoreFix)){document.querySelectorAll(`[data-open="${id}"] .rings,#${id} .article-aside .rings`).forEach(r=>{r.dataset.scores=v.join(',');r.innerHTML=''})}
decorateGenres();
})();
</script>
