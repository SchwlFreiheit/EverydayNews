].map(([term,label,desc])=>({term,label,desc,original:term})).sort((a,b)=>b.term.length-a.term.length);
function boundaryOK(text,i,len){const prev=text[i-1]||'',next=text[i+len]||'';const ascii=/[A-Za-z0-9_.-]/;return !ascii.test(prev)&&!ascii.test(next)}
function spanFor(e){const s=document.createElement('span');s.className='term auto-term';s.textContent=e.label;s.dataset.term=`${e.label}|${e.desc}|${e.original}`;return s}
function processTextNode(node){const text=node.nodeValue;if(!text||!/\p{Script=Latin}/u.test(text))return;let best=null;for(const e of lexicon){const i=text.indexOf(e.term);if(i<0||!boundaryOK(text,i,e.term.length))continue;if(!best||i<best.i||(i===best.i&&e.term.length>best.e.term.length))best={i,e}}if(!best)return;const frag=document.createDocumentFragment();if(best.i)frag.append(document.createTextNode(text.slice(0,best.i)));frag.append(spanFor(best.e));const rest=text.slice(best.i+best.e.term.length);if(rest)frag.append(document.createTextNode(rest));node.replaceWith(frag);if(rest){const tail=frag.lastChild;/* replaced fragment is emptied; find via parent next sibling below */}}
function localize(root){if(!root)return;let changed=true,guard=0;while(changed&&guard++<2200){changed=false;const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){const p=n.parentElement;if(!p)return NodeFilter.FILTER_REJECT;if(p.closest('.term,script,style,svg,a,code,pre,button,.meta,.article-kicker,.source-list'))return NodeFilter.FILTER_REJECT;return /\p{Script=Latin}/u.test(n.nodeValue||'')?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}});const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(const n of nodes){const before=n.nodeValue;let hit=false;for(const e of lexicon){const i=before.indexOf(e.term);if(i>=0&&boundaryOK(before,i,e.term.length)){const frag=document.createDocumentFragment();if(i)frag.append(document.createTextNode(before.slice(0,i)));frag.append(spanFor(e));if(i+e.term.length<before.length)frag.append(document.createTextNode(before.slice(i+e.term.length)));n.replaceWith(frag);hit=true;changed=true;break}}if(hit)break}}
 root.querySelectorAll('.term:not(.auto-term)').forEach(t=>{const raw=t.textContent.trim();const e=lexicon.find(x=>x.term===raw);if(e){t.textContent=e.label;t.dataset.term=`${e.label}|${e.desc}|${e.original}`}})
}
