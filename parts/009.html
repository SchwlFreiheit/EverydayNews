<script>
const scoreMeta=[{label:'重要度',color:'var(--lime)',icon:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>'},{label:'確度',color:'var(--cyan)',icon:'<path d="m5 12 4 4L19 6"/>'},{label:'新規性',color:'var(--violet)',icon:'<path d="M12 3v18M3 12h18"/>'},{label:'関連度',color:'var(--amber)',icon:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2"/>'}];
function ringsHTML(scores){return scores.map((v,i)=>`<span class="ring" style="--v:${v};--c:${scoreMeta[i].color}" data-label="${scoreMeta[i].label}" data-value="${v}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${scoreMeta[i].icon}</svg></span>`).join('')}
document.querySelectorAll('[data-scores]').forEach(x=>x.innerHTML=ringsHTML(x.dataset.scores.split(',').map(Number)));
const termPop=document.getElementById('termPop'),toastEl=document.getElementById('toast');let deepTarget=null;
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>toastEl.classList.remove('show'),1400)}
async function copyText(t){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);return}throw 0}catch(e){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}}
function openArticle(id){const o=document.getElementById(id);o.classList.add('open');o.querySelectorAll('.mode-panel').forEach((p,i)=>p.classList.toggle('active',i===0));o.querySelectorAll('.depth-switch button').forEach((b,i)=>b.classList.toggle('active',i===0));o.scrollTop=0;document.body.style.overflow='hidden';restoreFeedback(o)}
function closeArticle(o){o.classList.remove('open');document.body.style.overflow='';termPop.classList.remove('open')}
document.querySelectorAll('[data-open]').forEach(x=>x.addEventListener('click',()=>openArticle(x.dataset.open)));document.querySelectorAll('.close').forEach(x=>x.addEventListener('click',()=>closeArticle(x.closest('.overlay'))));
document.querySelectorAll('.depth-switch button').forEach(b=>b.addEventListener('click',()=>{const o=b.closest('.overlay'),m=b.dataset.mode;o.querySelectorAll('.depth-switch button').forEach(x=>x.classList.toggle('active',x===b));o.querySelectorAll('.mode-panel').forEach(p=>p.classList.toggle('active',p.dataset.modePanel===m));o.scrollTop=0}));
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('scroll',()=>{const h=o.scrollHeight-o.clientHeight;o.querySelector('.reading-progress i').style.width=(h?o.scrollTop/h*100:0)+'%'}));
document.addEventListener('click',e=>{const t=e.target.closest('.term');if(t){e.stopPropagation();const [title,desc,original]=t.dataset.term.split('|');termPop.innerHTML=`<b>${title}</b><p>${desc}</p><small>${original||''}</small><div class="term-actions"><button data-term-chat>Chat用コピー</button></div>`;const r=t.getBoundingClientRect();termPop.style.left=Math.max(12,Math.min(r.left,window.innerWidth-390))+'px';termPop.style.top=Math.max(12,Math.min(r.bottom+8,window.innerHeight-210))+'px';termPop.classList.add('open');termPop.querySelector('[data-term-chat]').onclick=async()=>{await copyText(`「${title}」について、この文脈に必要な基礎から始めて、具体例、仕組み、関連概念まで詳しく説明して。`);toast('Chat用プロンプトをコピー')};return}if(!e.target.closest('#termPop'))termPop.classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){termPop.classList.remove('open');document.querySelectorAll('.overlay.open').forEach(closeArticle);document.getElementById('deepModal').classList.remove('open')}});
document.querySelectorAll('.chatcopy').forEach(b=>b.addEventListener('click',async()=>{await copyText(b.dataset.prompt);toast('Chat用プロンプトをコピー')}));
function refreshStoryStates(){document.querySelectorAll('.story').forEach(s=>{const id=s.dataset.open,state=s.querySelector('.state');state.innerHTML=[localStorage.getItem('fb:'+id+':track')==='1'?'<span class="state-chip deep">追跡</span>':'',localStorage.getItem('fb:'+id+':save')==='1'?'<span class="state-chip">保存</span>':''].join('')})}
document.querySelectorAll('[data-feedback]').forEach(b=>b.addEventListener('click',()=>{const id=b.closest('.overlay').id,k='fb:'+id+':'+b.dataset.feedback,on=localStorage.getItem(k)!=='1';on?localStorage.setItem(k,'1'):localStorage.removeItem(k);b.classList.toggle('active',on);refreshStoryStates();toast('保存した')}));
function feedbackHTML(){return `<h3>反応</h3><div class="feedback-row"><div class="interest"><span>興味</span><div class="dots">${[1,2,3,4,5].map(n=>`<button class="dot" data-rating="${n}" title="${n}/5"></button>`).join('')}</div></div><div class="feedback-actions"><button data-fb="known">既知</button><button data-fb="save">保存</button><button data-fb="track">追跡</button><button data-fb="hide">興味なし</button></div></div>`}
document.querySelectorAll('.feedback').forEach(f=>{f.innerHTML=feedbackHTML();f.querySelectorAll('[data-rating]').forEach(b=>b.onclick=()=>{const id=f.dataset.article,n=+b.dataset.rating;localStorage.setItem('rating:'+id,n);document.querySelectorAll(`.feedback[data-article="${id}"] [data-rating]`).forEach(x=>x.classList.toggle('active',+x.dataset.rating<=n));toast('興味度を保存')});f.querySelectorAll('[data-fb]').forEach(b=>b.onclick=()=>{const id=f.dataset.article,k='fb:'+id+':'+b.dataset.fb,on=localStorage.getItem(k)!=='1';on?localStorage.setItem(k,'1'):localStorage.removeItem(k);document.querySelectorAll(`.feedback[data-article="${id}"] [data-fb="${b.dataset.fb}"]`).forEach(x=>x.classList.toggle('active',on));refreshStoryStates();toast('保存した')})});
function restoreFeedback(o){const id=o.id,n=+(localStorage.getItem('rating:'+id)||0);o.querySelectorAll('.feedback').forEach(f=>{f.querySelectorAll('[data-rating]').forEach(x=>x.classList.toggle('active',+x.dataset.rating<=n));f.querySelectorAll('[data-fb]').forEach(b=>b.classList.toggle('active',localStorage.getItem('fb:'+id+':'+b.dataset.fb)==='1'))});o.querySelectorAll('[data-feedback]').forEach(b=>b.classList.toggle('active',localStorage.getItem('fb:'+id+':'+b.dataset.feedback)==='1'))}
const deepOptions={funes:['第三者ベンチ','検索ミス','競合記憶方式','Codex統合','A.S.T.R.A.実験'],voice:['日本語実測','RTX 3070','1.5B量子化','既存STT比較','MIRA統合'],ruby:['研究者の完全解析','OpenAI追加説明','権限設計','類似事件','再発防止'],space:['84天体の分類','Ia型超新星','銀河電離','スペクトル解析','続報']};
document.querySelectorAll('.deep').forEach(b=>b.addEventListener('click',()=>{deepTarget=b.closest('.overlay').id;const f=document.getElementById('focuses');f.innerHTML=deepOptions[deepTarget].map(x=>`<button data-focus="${x}">${x}</button>`).join('');f.querySelectorAll('button').forEach(x=>x.onclick=()=>x.classList.toggle('active'));document.getElementById('deepModal').classList.add('open')}));document.getElementById('deepCancel').onclick=()=>document.getElementById('deepModal').classList.remove('open');document.getElementById('deepSave').onclick=()=>{const vals=[...document.querySelectorAll('#focuses .active')].map(x=>x.dataset.focus);if(!vals.length){toast('深掘り方向を選んで');return}localStorage.setItem('deep:'+deepTarget,JSON.stringify(vals));document.getElementById('deepModal').classList.remove('open');toast('次回更新へ追加')};
for(const c of document.querySelectorAll('.candidate')){const dots=c.querySelector('.cand-dots');for(let i=1;i<=5;i++){const b=document.createElement('button');b.className='cand-dot';b.title=`興味 ${i}/5`;b.onclick=()=>{localStorage.setItem('cand:'+c.dataset.cand,i);[...dots.children].forEach((x,j)=>x.classList.toggle('active',j<i))};dots.appendChild(b)}const n=+(localStorage.getItem('cand:'+c.dataset.cand)||0);[...dots.children].forEach((x,j)=>x.classList.toggle('active',j<n));const want=c.querySelector('.cand-next');want.classList.toggle('active',localStorage.getItem('want:'+c.dataset.cand)==='1');want.onclick=()=>{const on=!want.classList.contains('active');want.classList.toggle('active',on);on?localStorage.setItem('want:'+c.dataset.cand,'1'):localStorage.removeItem('want:'+c.dataset.cand)}}
refreshStoryStates();
</script></body></html>
