<div class="article-head"><div><div class="article-kicker">NEUROTECH / PEER-REVIEWED · 2026-09-14</div><h1>発話とジェスチャーを同時に読むBCI</h1><div class="dek">単一の高密度ECoGインプラントから、言葉と身振りを並列に解読し、本人向け全身アバターへリアルタイムに反映したNature Neuroscienceの初期実証。</div></div><aside class="article-aside"><div class="rings" data-scores="92,96,93,76"></div><div class="article-actions"><button class="chatcopy" data-prompt="Broslerら2026年の発話＋ジェスチャー同時BCIについて、ECoG、並列デコーダ、同時行動を含む訓練、cross-modality rest、リアルタイム精度、サンプルサイズ、臨床上の限界、公開コードまで原論文ベースで詳しく説明して。">Chat用コピー</button><button class="bci-deep">次回深掘り</button></div><div class="bci-deep-note">深掘り方向を選んで、次回巡回でこの記事を成長させられる。</div></aside></div>

<div class="mode-panel active" data-mode-panel="overview"><div class="mode-layout"><main class="mode-main"><section class="section" id="bci-o-main"><p class="lead">これまでは「話す」か「動く」を別々に読むBCIが中心だった。今回の研究は、<span class="key">同じ脳表インプラントから発話とジェスチャーを同時に読み、二つを一緒にアバターへ出す</span>ところまで動かした。</p><p>対象は重度の麻痺がある3人。単一の高密度<span class="term" data-term="ECoG|脳の表面に電極シートを置き、神経集団の電気活動を計測する方法。頭皮EEGより信号が強い一方、手術が必要。|electrocorticography">ECoG</span>電極で、口や顔だけでなく手・腕など複数部位の神経活動を捉えられることを確認した。リアルタイムの全身アバター実験はそのうち2人で行った。</p><div class="fact-grid"><div class="fact-cell"><b>1枚の電極</b><span>発話用とジェスチャー用に別の脳インプラントを置くのではなく、一つの広いECoGグリッドから両方を読む。</span></div><div class="fact-cell"><b>66% / 70%</b><span>Bravo-6の同時コピー課題で、ジェスチャー66%、発話70%。各10種類＋restを扱う実時間実験。</span></div><div class="fact-cell"><b>査読済み</b><span>Nature Neuroscience、2026年9月14日公開。ただし3人規模の初期実証で、日常利用できる製品ではない。</span></div></div>
<div class="actual-media"><div class="media-label"><span>実物｜論文 Figure 5</span><a href="${paper}#Fig5" target="_blank" rel="noopener">原図を開く ↗</a></div><a href="${paper}#Fig5" target="_blank" rel="noopener"><img src="${figure5}" alt="Nature Neuroscience Figure 5: ECoG BCIによる全身アバター制御" loading="lazy"></a><div class="media-caption"><strong>見る場所：</strong>上段aでは、発話とジェスチャーを脳信号から並列分類し、文字とアバター動作へ分けて出す実システムの流れが示される。下段b〜eは実時間精度と誤作動率。Brosler et al., Nature Neuroscience (2026), <span class="media-license">CC BY 4.0</span>。</div></div>
<p>面白い点は、単純に二つの分類器を並べただけではないこと。同時に話して身振りしようとすると脳活動のパターンが単独時と少し変わるため、<span class="key">「発話だけ」「ジェスチャーだけ」「両方同時」を訓練データへ入れる</span>必要があった。さらに、片方だけをしている時間をもう片方の「何もしていない」例として学習させ、誤作動を抑えた。</p><p class="secondary">確度は高いが、対象者は3人、リアルタイム同時会話は2人、語彙と身振りの種類も限定的。侵襲的な手術と個人別訓練が必要なので、「自然な会話BCIが実用化した」と読むのは早い。</p></section><div class="feedback" data-article="bci-multi"></div></main><aside class="toc"><h4>概要</h4><a href="#bci-o-main">何ができた？</a><div class="hint">まずFigure 5を見ると、入力→並列デコード→アバター出力が一目で分かる。</div></aside></div></div>

<div class="mode-panel" data-mode-panel="explain"><div class="mode-layout"><main class="mode-main">
<section class="section" id="bci-e-why"><h2>なぜ「同時」が難しいのか</h2><p class="lead">脳の運動野は、発話用・手用が完全に分離したスイッチ盤ではない。</p><p>研究では、発話と上肢ジェスチャーに反応する電極の一部が重なっていた。しかも同じ「hello」や同じ身振りでも、単独で行う時と別の行動と同時に行う時では神経表現が完全には一致しない。実際、単独行動だけで学習したモデルは、同時行動テストで<span class="term" data-term="False Negative|本当は発話やジェスチャーを試みているのに、デコーダがrest（何もしていない）と判定する誤り。|false negative">見逃し</span>が増えた。</p><div class="method-compare"><div><b>単独データだけで学習</b><p>単独課題では強いが、発話＋身振りが重なると「いつものパターンと違う」と判定しやすく、同時課題へ一般化しにくい。</p></div><div><b>単独＋同時を混ぜて学習</b><p>両方の文脈を経験させると、単独でも同時でも見逃し率を低く保ちやすくなった。</p></div></div><p>さらに「発話しかしていない試行」をジェスチャーデコーダ側のrestとして、「ジェスチャーしかしていない試行」を発話デコーダ側のrestとして学習する<span class="term" data-term="Cross-modality training|対象ではない別モダリティの活動を、対象デコーダにとってのrest例として学習させる方法。並列実行時の誤作動を抑える。|cross-modality rest training">クロスモダリティ学習</span>を加えた。反対側の行動を誤検出する率は両参加者で0%まで下がった。</p></section>
<section class="section" id="bci-e-demo"><h2>実際の会話デモ</h2><p>Bravo-6は、会話相手への返答を発話だけ、ジェスチャーだけ、または両方で試みる。予測された発話は画面下へ文字として出て、予測されたジェスチャーは本人用アバターの身体動作になる。</p><div class="actual-media"><div class="media-label"><span>実物｜Supplementary Video 3</span><a href="${video3}" target="_blank" rel="noopener">MP4を直接開く ↗</a></div><video controls preload="metadata" playsinline poster="${figure5}"><source src="${video3}" type="video/mp4">動画を再生できない場合は上のリンクから原動画を開いてください。</video><div class="media-caption"><strong>見る場所：</strong>会話相手の問いに対し、脳信号から推定した発話は文字へ、ジェスチャーは全身アバターの動きへ同時に反映される。これは論文の実デモで、宣伝用の再現CGではない。Brosler et al. Supplementary Video 3, <span class="media-license">CC BY 4.0</span>。</div></div><p>Bravo-6の会話課題は5ブロックだけの概念実証で、平均精度はジェスチャー85%、発話75%。Bravo-1rは3ブロックの中央値が両方100%だった。ただし試行数が非常に少ないため、100%という数字だけを一般性能として読むべきではない。</p></section>
<section class="section" id="bci-e-code"><h2>再現材料はどこまで公開？</h2><p>論文のFigure基礎データと、主要なオフライン学習・評価パイプラインを示すコードはChang LabのGitHubで公開されている。公開ノートブックには、同時試行を含むnested cross-validationとmodel ensemble、反対モダリティをrestへ入れる学習例が含まれる。</p><p>一方、臨床試験のECoG神経データはプロトコル上の制約で完全公開ではなく、Zenodoの制限付きアクセス。したがって「誰でも全実験をそのまま再現できる」状態ではない。</p></section><div class="feedback" data-article="bci-multi"></div></main><aside class="toc"><h4>解説</h4><a href="#bci-e-why">同時が難しい理由</a><a href="#bci-e-demo">実動画</a><a href="#bci-e-code">コードとデータ</a></aside></div></div>

<div class="mode-panel detail" data-mode-panel="detail"><div class="mode-layout"><main class="mode-main">
<section class="section" id="bci-d-design"><h2>研究設計と参加者</h2><p class="lead">これはPhase Iの単施設・early-feasibility臨床試験BRAVO内で行われた、少人数の侵襲型BCI研究。</p><p>神経活動は3人から記録された。Bravo-1rとBravo-3は脳幹梗塞、Bravo-6はALSに由来する麻痺を持つ。電極は感覚運動皮質を広く覆う高密度ECoGで、発話・口顔面・上肢など複数の運動表現を一枚から取得する。データ収集期間は2022年9月〜2025年11月。</p><p>同時発話＋ジェスチャーおよび全身アバターの実時間実験は、Bravo-3が試験から離脱した後に行われたためBravo-1rとBravo-6の2人のみ。Bravo-6は10ジェスチャー、10発話、100通りの組み合わせを扱い、Bravo-1rは4ジェスチャー、5発話、12組み合わせを扱った。</p></section>
<section class="section" id="bci-d-offline"><h2>オフライン精度と一般化</h2><p>単独データのみ、同時データのみ、両方を混ぜるhybridの3条件を比較した。単独だけで学習すると同時試行でfalse negativeが大きく増えた。Bravo-6では単独テストの中央値0.0%から同時テスト14.5%へ、Bravo-1rでは0.8%から34.9%へ上昇。hybridでは単独/同時の両方で低い見逃し率を維持した。</p><p>最終モデルの同時試行オフライン平均精度は、Bravo-6がジェスチャー68.8%（95% CI 66.4–71.1）、発話77.5%（75.1–79.8）。Bravo-1rはジェスチャー88.3%（86.8–89.6）、発話84.0%（82.8–85.1）。chanceはクラス数に応じて9.1〜20%。</p><p>Bravo-6では、訓練で見た発話＋身振りの組み合わせと未見の組み合わせで、ジェスチャー65.8%対66.7%、発話79.3%対80.0%で有意差がなかった。これは「100組を全部個別暗記しただけ」ではない可能性を支持するが、1人の限定語彙内での結果なので大規模語彙への外挿はできない。</p></section>
<section class="section" id="bci-d-live"><h2>リアルタイム性能</h2><p>Bravo-6のジェスチャー単独コピー課題は81.8%（95% CI 74.5–89.1）、Bravo-1rは61.7%（55.3–68.2）。Bravo-6の発話＋ジェスチャー同時コピー課題では、ジェスチャー66.0%（59.5–72.5）、発話70.0%（63.5–76.0）。</p><p>会話課題は性能測定というよりproof-of-conceptに近い。Bravo-6は5ブロックで平均ジェスチャー85%、発話75%。Bravo-1rは3ブロックの中央値が両方100%。試行が少ないので、この100%を臨床精度の代表値として使うのは不適切。</p><p>重要なのは誤作動対策。true restだけでなく反対モダリティだけの試行もrestへ含めることで、「話しただけなのにアバターの手が動く」「身振りしただけなのに発話が出る」という並列デコーダ固有のfalse positiveを抑えた。</p></section>
<section class="section" id="bci-d-stats"><h2>統計・査読・公開性</h2><p>比較には主として両側Mann–Whitney U検定を用い、多重比較はBenjamini–Hochberg FDRで補正。95% CIは10,000回のノンパラメトリックbootstrapで計算した。Nature Neuroscienceで査読を受け、査読者情報も公開されている。</p><p>論文はCC BY 4.0のオープンアクセス。FigureとSupplementary Videoは、第三者素材に個別注記がない限り同ライセンスに含まれる。この記事で表示しているFigure 5とVideo 3はいずれも原論文の実物メディア。</p><div class="source-list compact"><div class="source"><div><b>Nature Neuroscience</b><span>査読済み原論文・Figure・Supplementary Video</span></div><a href="${paper}" target="_blank" rel="noopener">開く ↗</a></div><div class="source"><div><b>Chang Lab GitHub</b><span>モデル・評価・Figure生成コード</span></div><a href="${code}" target="_blank" rel="noopener">開く ↗</a></div><div class="source"><div><b>Nature News</b><span>研究者・外部専門家への取材を含む独立解説</span></div><a href="${natureNews}" target="_blank" rel="noopener">開く ↗</a></div></div></section>
<section class="section" id="bci-d-limits"><h2>どこまで言えて、どこから言えないか</h2><p><span class="key">強く言える：</span>一つのECoGグリッドで複数身体部位の情報を拾い、限定語彙では発話とジェスチャーを同時に並列解読して全身アバターを実時間制御できた。同時行動を訓練へ含めることと、反対モダリティをrestへ含めることが性能安定化に効いた。</p><p><span class="key">まだ言えない：</span>一般患者で同じ精度になる、自由会話・自由な身振りを無制限に扱える、非侵襲型でも同じことができる、長期間の日常利用で安定する、ということ。参加者3人、実時間2人、個人別モデル、限定語彙、手術必須という制約は大きい。</p><p>また著者の一部には神経デコーディング関連の特許出願があり、責任著者はEcho Neurotechnologiesの共同創業者。研究の妥当性を否定する材料ではないが、実用化評価では利害関係として把握しておくべき。</p></section><div class="feedback" data-article="bci-multi"></div></main><aside class="toc"><h4>詳細</h4><a href="#bci-d-design">研究設計</a><a href="#bci-d-offline">オフライン精度</a><a href="#bci-d-live">実時間性能</a><a href="#bci-d-stats">統計と公開性</a><a href="#bci-d-limits">限界</a></aside></div></div>
</div></div>`);
}

  if(ov)ov.insertAdjacentHTML('beforeend',`<div class="update-box"><div class="u-kicker">RELATED EVIDENCE · SEP 10</div><h3>記憶は「書く前」に現環境で検証する</h3><p>Microsoftの新しいarXiv研究は、タスク履歴だけから長期記憶を作ると誤解・過度な一般化・古い情報を保存しやすいと指摘。記憶を書ける別curatorへ最小権限のread-only環境ツールだけを与え、保存前にDBやファイルを再確認する方法を評価した。Agent Zero Memoryの「出典へ戻れる記憶」に加え、<strong>保存時点で事実を再検証する層</strong>がA.S.T.R.A.には有力。</p></div>`);
  const ex=az.querySelector('[data-mode-panel="explain"] .mode-main'); const exfb=ex&&ex.querySelector('.feedback');
  if(exfb)exfb.insertAdjacentHTML('beforebegin',`<section class="section" id="az-e-ground"><h2>続報：記憶を書き込む前の環境プローブ</h2><p>Microsoftの「Grounding Agent Memory」は、回答するtask agentではなく、タスク終了後に記憶を整理するcuratorだけへread-onlyの環境ツールを与える。候補記憶が「このDBでは常にこの列を使う」「このファイルが正しい参照先」のような主張を含む時、実際の環境を再読して適用範囲や鮮度を確認してからcreate / update / deleteする。</p><p>CLBenchのschema-drift条件では、statelessが39%、通常のindexed memoryが70%、environment probing付きが73%のpass rate。したがって「39→73」は記憶なしとの比較であり、<strong>既存memoryへprobeを追加した純増は70→73ポイント</strong>。一方、task-agent側の平均queryは通常memory 5.6→probe 4.7、task-agent costは$1.99→$1.68と減った。</p><p class="note">これはAgent Zero Memoryと競合するというより補完関係。provenance/citation lockは「答える時の根拠」を強くし、environment probingは「覚える前の根拠」を強くする。</p></section>`);
  const de=az.querySelector('[data-mode-panel="detail"] .mode-main'); const defb=de&&de.querySelector('.feedback');
  if(defb)defb.insertAdjacentHTML('beforebegin',`<section class="section" id="az-d-ground"><h2>追加検証：Environment-Probing Curation</h2><p>arXiv:2609.11060は、GitHub Copilot SDK上のproduction-like harnessで、stateless、過去trajectory全文を入れるfull-context、indexed memory、indexed memory＋environment probingを比較した。CLBenchでは途中でSQLite schemaが変更されるため、過去に正しかった記憶が陳腐化する状況を意図的に含む。</p><p>重要な比較は二つに分けて読むべき。memoryを持つこと自体の効果はstateless 39%からindexed memory 70%への大幅改善。probeを足す追加効果は70%から73%で、劇的な34ポイント増のすべてがprobe由来ではない。probe付きはpass-discounted reward 22.60、query 4.7、task-agent cost $1.68で最良だった。90件のAPEX適応タスクでも、memory条件は全18比較でbaselineより平均rewardが高く、tool callを16〜75%減らした。</p><p>ただし論文は2026年9月10日のpreprintで査読前。著者の完全な実験コードは見つからず、独立サイトAuto Researchの再現は「候補の再プローブ・矛盾拒否・記憶受入れ」という核心状態遷移の縮小再現に留まり、GitHub Copilot SDKを含む本番相当ベンチマークの独立再現ではない。また論文の$1.68はtask-agent costで、curation側の追加コストは別計上。この数字だけで総運用費が半減すると断定してはいけない。</p><p>A.S.T.R.A./MIRAへ移すなら、永続記憶のwriterをtask agentから分離し、writerだけにread-onlyの確認経路を与える設計が安全。ユーザーの明示発言は原文へ戻り、PC状態・GitHub状態・予定など変化し得る情報は保存前または再利用前に接続先へ再照会し、推測プロフィールは確定事実と別レイヤーへ置くのがよい。</p><div class="source-list compact"><div class="source"><div><b>arXiv:2609.11060</b><span>Microsoft著者の一次資料</span></div><a href="https://arxiv.org/abs/2609.11060" target="_blank" rel="noopener">開く ↗</a></div><div class="source"><div><b>Auto Research</b><span>核心機構のみの独立縮小再現。完全ベンチ再現ではない</span></div><a href="https://daiwk.github.io/auto-research/agent-research/2609.11060-grounded-memory/" target="_blank" rel="noopener">開く ↗</a></div></div></section>`);
}

 const btn=document.querySelector('#bci-multi .bci-deep'),modal=document.getElementById('deepModal'),focuses=document.getElementById('focuses'),save=document.getElementById('deepSave');
 if(!btn||!modal||!focuses||!save)return;

 const oldSave=save.onclick;save.onclick=()=>{if(modal.dataset.owner!=='bci-multi'){if(oldSave)oldSave();return}const vals=[...focuses.querySelectorAll('.active')].map(x=>x.dataset.focus);if(!vals.length){if(typeof toast==='function')toast('深掘り方向を選んで');return}localStorage.setItem('deep:bci-multi',JSON.stringify(vals));modal.classList.remove('open');modal.dataset.owner='';if(typeof toast==='function')toast('次回更新へ追加')};
