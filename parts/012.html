<div class="overlay" id="solpi" style="--article-accent:#8dff9e"><div class="article-shell">
<div class="article-nav"><div class="nav-left"><strong>RADAR</strong><span>AI / AGENT HARNESS EFFICIENCY</span></div><div class="depth-switch"><button data-mode="overview" class="active">概要</button><button data-mode="explain">解説</button><button data-mode="detail">詳細</button></div><button class="close">×</button><div class="reading-progress"><i></i></div></div>
<div class="article-head"><div><div class="article-kicker">NVIDIA RESEARCH · REPO CREATED 2026-09-02 · VERIFIED 2026-09-16</div><h1>SoL-Pi</h1><div class="dek">AIエージェントが長く働くほど増える「同じ出力の再送」「検証のためだけの追加ターン」「巨大ログの再読」を、モデルを強くするのではなく実行基盤側で減らす研究とOSS。</div></div><aside class="article-aside"><div class="rings" data-scores="96,87,95,99"></div><div class="article-actions"><button class="chatcopy" data-prompt="NVIDIA SoL-Piについて、4つの効率化機構、auto-researchの探索・検証設計、EdgeBenchとTerminal-Bench 4の結果、公開版と測定版の差、GitHub issue、セキュリティ、A.S.T.R.A./ChatBridgeへ移植できる設計原理を一次資料ベースで詳しく分析して。">Chat用コピー</button><button class="solpi-deep">次回深掘り</button></div><div class="solpi-small">次回は、実装コード・ベンチ再現・A.S.T.R.A.適用などから指定して追加調査できる。</div></aside></div>

<div class="mode-panel active" data-mode-panel="overview"><div class="mode-layout"><main class="mode-main"><section class="section" id="sp-o-main"><p class="lead"><strong>SoL-Piは新しいAIモデルではない。</strong> Coding Agentが何時間もコードを読み、編集し、テストする時に生じる無駄を、<span class="key">ツール呼び出し・観測結果・コンテキスト・長いログ</span>の4か所で減らすPi用拡張だ。</p><p>NVIDIAの研究チームは、エージェントの実行履歴から152個の改善案を作り、実装・レビュー・訓練側検証・隔離したheld-out検証を通して4つだけを残した。重要なのは「AIに効率化案を考えさせた」ことより、<strong>思いつきをそのまま採用せず、実行可能な検証器で落とし続けた</strong>点にある。</p>
<div class="actual-media"><div class="media-label"><span>実物｜NVlabs公式リポジトリの研究ビジュアル</span><a href="${repo}/blob/main/assets/sol-pi-hero.png" target="_blank" rel="noopener">原画像を開く ↗</a></div><a href="${project}" target="_blank" rel="noopener"><img src="${hero}" alt="NVlabs SoL-Pi research visual" loading="lazy"></a><div class="media-caption"><strong>見る場所：</strong>コードや研究候補を何段階もたどり、検証を通った改善だけを残すという研究全体の構図。個々の4機構の詳細は公式研究ページのインタラクティブ図と下の説明で確認できる。出典: NVlabs/SoL-Pi（MIT repository）。</div></div>
<div class="solpi-mechanisms"><div class="solpi-mechanism"><span class="num">01 · TOOLS</span><h3>Action Fusion</h3><p>編集の直後に必ず行うテストやbuildを同じtool callへまとめる。途中でモデルへ戻す必要がない時だけ1ターン減らす。</p></div><div class="solpi-mechanism"><span class="num">02 · OBSERVATIONS</span><h3>ObservationPack</h3><p>巨大なread・logを毎ターン再送せず、ローカルへ保存してhandle＋短い抜粋だけ残す。必要なページは後から原文どおり再取得できる。</p></div><div class="solpi-mechanism"><span class="num">03 · CONTEXT</span><h3>Online Context Compact</h3><p>context windowが限界になるまで待たず、サブタスク完了を圧縮候補にする。ただし将来の節約が書き換えコストを回収できる時だけ実行する。</p></div><div class="solpi-mechanism"><span class="num">04 · LOG READING</span><h3>Evidence-Preserving Reducer</h3><p>長い診断ログの最初の読解を小さなmodelへ任せる場合でも、採用する引用が保存済み原文と一致することを検証してから本体へ渡す。</p></div></div>
<div class="solpi-verdict"><div class="good"><b>なぜA.S.T.R.A.に重要？</b><p>長い開発run、DevSpace/ChatBridgeの巨大出力、checkpoint、検証コマンドという現在の課題と、SoL-Piが狙う無駄がかなり重なる。Piそのものを導入しなくても、4機構の設計原理は移植候補になる。</p></div><div class="caution"><b>ただし「半額で同じ性能」ではない</b><p>公式EdgeBenchではPi比45–49%少ないtokenだが、組み合わせたharnessの平均scoreはPiのおよそ94%。Terminal-Bench 4でもSoL-Piは15/63、PiとCodexは18/63だった。効率化には能力側の代償がある。</p></div></div>
<p class="secondary">確度は「実装が存在する」「公式評価が公開されている」点では高い。一方、論文はまだ“coming soon”で、主要ベンチを公開releaseそのものへ第三者が再実行した独立再現は確認できなかった。このため評価は87/100に抑えた。</p></section><div class="feedback" data-article="solpi"></div></main><aside class="toc"><h4>概要</h4><a href="#sp-o-main">何が見つかった？</a><div class="hint">注目点は4つの機構そのものと、152案を4案まで落とした検証フローの両方。</div></aside></div></div>

<div class="mode-panel" data-mode-panel="explain"><div class="mode-layout"><main class="mode-main">
<section class="section" id="sp-e-research"><h2>「AIに改善させる」を、研究工程として固定した</h2><p>研究チームは495個のGitHub issue–PR由来環境と40個のverifier-driven環境、合計535個の実行環境を作った。issue–PR型では修正前commitへ戻し、依存関係をoffline imageへ入れ、正解PRとmaintainerのregression testはagentから隠す。修正前にtestが落ち、正解PR後に通る環境だけを残す。</p><div class="solpi-flow"><div class="step">Trajectory<br>実行履歴を集める</div><div class="arrow">→</div><div class="step">Map–Reduce<br>複数履歴を分析</div><div class="arrow">→</div><div class="step">Proposal<br>改善仮説を1つ作る</div><div class="arrow">→</div><div class="step">Implementation<br>別agentが実装</div></div><div class="solpi-flow"><div class="step">Reviewer<br>別agentが契約を確認</div><div class="arrow">→</div><div class="step">Train側 validation</div><div class="arrow">→</div><div class="step">Freeze</div><div class="arrow">→</div><div class="step">Held-out validation<br>結果を学習へ戻さない</div></div><p>EdgeBenchは探索中に見せず、最終評価だけに使う。held-outで落ちた候補をその結果を手掛かりに修理し直すこともしない。この隔離は、agentがbenchmark固有の癖をharnessへ埋め込むのを減らすためだ。</p></section>
<section class="section" id="sp-e-disposable"><h2>大規模オーケストレーションで残ったのは「使い捨てSkill Loop」</h2><p>研究工程そのものも3回作り直されている。最初はYAMLで固定したcompiled workflowだったが、例外へ弱く人間の修理が増えた。次にlead agentが長寿命のcoordination codeを持つ方式へ移したが、分岐・test・互換コードが増殖し、新しい実験の追加に10時間以上かかることがあった。</p><p>最終的には、<strong>小さな正規template＋使い方の指示だけを恒久化し、各実験でfresh copyを作り、run終了後にそのorchestration codeを捨てる</strong>方式になった。A.S.T.R.A.に引きつけると、一つの巨大controllerへ例外を足し続けるより、LAPLACEや各protocolが共通contractを持った短命workerを起動する構造の方が保守しやすい可能性を示している。</p><p class="note">ただし、使い捨てにすれば設計責任が消えるわけではない。全runが継承するtemplateの誤りは一斉に複製されるため、template自体の検証が最重要になる。</p></section>
<section class="section" id="sp-e-results"><h2>性能は「節約」と「落ちた仕事」を一緒に読む</h2><table class="solpi-bench"><thead><tr><th>評価</th><th>SoL-Pi</th><th>比較</th><th>読み方</th></tr></thead><tbody><tr><td>EdgeBench</td><td><strong>Pi比45–49% fewer tokens</strong><br>cost 約1/3減</td><td>平均scoreはPiの約94%</td><td>長時間runでは大幅に安いが、能力は完全同等ではない。</td></tr><tr><td>Terminal-Bench 4<br>CPU 63 tasks</td><td><strong>15/63</strong><br>$211.12 total</td><td>Pi 18/63 / $286.45<br>Codex 18/63 / $272.35</td><td>解けた1件あたりは安いが、3件多く落としている。</td></tr><tr><td>ObservationPack<br>paired 11 tasks</td><td><strong>bill −23.58%</strong><br>cost/response −23.73%</td><td>normalized score +22.92%</td><td>同時cluster A/B。ただし公開releaseと同一artifactではない。</td></tr></tbody></table><p>公式ページ自身が、各機構のcapability floorは機構ごとに適用され、小さな損失が組み合わせ時に累積しうると書いている。第三者のsource auditもここを中心に検証し、heroの「Spend less without getting less done」は、system全体の結果として読むと強すぎる表現だと指摘している。</p></section>
<section class="section" id="sp-e-use"><h2>A.S.T.R.A.へ持ち込むなら「製品」ではなく境界を借りる</h2><div class="plain-list"><div><strong>Action Fusion →</strong> 編集と決定論的な検証が必ず連続する時だけ、Bridge側でatomicな一操作にする。途中の結果で次のcommandが変わる場合は融合しない。</div><div><strong>ObservationPack →</strong> DevSpaceやtoolの巨大出力を永続archiveへ置き、会話へはhandle・短いhead/tail・hashだけを返す。必要時にpage単位で原文を再取得する。</div><div><strong>Evidence-Preserving Reducer →</strong> 要約を信用せず、引用行・source hash・offsetを検証できたreceiptだけ使う。別model委任を使わない運用なら、deterministic抽出＋原文照合だけ借りても価値がある。</div><div><strong>Online Context Compact →</strong> 「tokenが多いから」ではなく、subtask完了＋checkpoint保存＋今後の節約が圧縮コストを上回る、という三条件で圧縮候補にする。</div><div><strong>Disposable skill loop →</strong> run固有のorchestrationを恒久controllerへ追加せず、versioned templateから短命runを生成し、結果と証拠だけを残す。</div></div></section><div class="feedback" data-article="solpi"></div></main><aside class="toc"><h4>解説</h4><a href="#sp-e-research">研究フロー</a><a href="#sp-e-disposable">Skill Loop</a><a href="#sp-e-results">結果の読み方</a><a href="#sp-e-use">A.S.T.R.A.適用</a></aside></div></div>

<div class="mode-panel detail" data-mode-panel="detail"><div class="mode-layout"><main class="mode-main">
<section class="section" id="sp-d-mechs"><h2>4機構は「モデルに考えさせる前後」の無駄を狙う</h2><h3>Action Fusion</h3><p>Piのbase trajectoryでは、edit/writeの直後にbashでtest/buildを行う隣接パターンがcross-turn遷移の12.3%に見つかった。そこでedit/write schemaへfollow-up commandを足し、mutation後のfile hashが変わっていないことを確認してからcommandを実行する。公式の探索履歴にある「全149候補で発火したらturn −10.8%、token −11.5%」は実測rerunではなくcounterfactual推定なので、実測値と混同してはいけない。</p><h3>ObservationPack</h3><p>大きなtool resultをsession directoryへ原文保存し、active contextではhandleと短いhead/tailへ射影する。必要になった時はexact page recallで戻す。最終paired EdgeBenchは11 tasks × 2 armsを同じclusterで並行実行し、response数差は0.20%。V2は2,048-byte head、1,536-byte tail、最初の2回はfull sendという設定だった。</p><h3>Evidence-Preserving Reducer</h3><p>長大なbash logを別modelへ渡して短いdiagnostic receiptを作るが、そのreceipt中の引用がarchiveの原文と一致するか、source hashやschema条件を満たすかを検査する。検査に失敗すれば元resultをそのまま返すfail-open設計。ただしremote reducerを使えばlog自体が外部modelへ送られる可能性がある。</p><h3>Online Context Compact</h3><p>planのsubtask境界を圧縮候補にし、provider-counted context sizeと将来request数から経済性を見積もる。Pi 0.85.1ではmanual compactionがactive agentをabortする仕様のため、plan/stateを保存してsettled後にcompactし、成功時だけhidden reminderから新turnを起動して作業を継続する。</p></section>
<section class="section" id="sp-d-release"><h2>公開releaseと「数字を出したartifact」は完全には同じではない</h2><p>2026年9月16日時点のmainはPi 0.85.1を開発・test対象とし、0.84.2互換も維持している。compatibility文書は19 test files・140 tests、type check、package inspection、public API check、offline startupを両versionで通したと記載する。</p><p>一方、第三者source auditが公式figureのfooterを追ったところ、ObservationPackの主要paired結果は<strong>Pi 0.80.10上のplaceholder variant</strong>で、公開されていない研究用refを使った11-task実験だった。これは「公開版が遅い/壊れている」という証拠ではないが、公開releaseをそのまま入れれば同じ−23.58%が出るという独立再現にもなっていない。</p><p>研究論文も公式ページではまだ“Paper · Coming soon”。現時点で最も詳細な一次資料はプロジェクトページ、公開source、compatibility/test群であり、査読論文の方法節ではない。</p></section>
<section class="section" id="sp-d-issues"><h2>Issueから見えるintegration失敗</h2><p>Action FusionはPi標準のedit/write toolを置き換えて<code>then_run</code>を追加する。そのため、別extensionが後から同名toolを再登録したり、flat-tool wrapperがschemaを変えたりすると、modelから<code>then_run</code>へ到達できなくなる。</p><p>Issue #20は当初「Pi 0.85.1でthen_runが黙って消える」と報告されたが、clean-roomでは0.84.2/0.85.1の両方で成功し、投稿者自身が原因を別extension <code>pi-nolo</code>によるedit再登録だと追跡した。つまりversion regressionではなく<strong>tool ownership / schema collision</strong>だった。SoL-Piを他pluginと混ぜる時は、設定ファイルを見るだけでなく、modelが実際に受け取るtool schemaとownerを見る必要がある。</p><p>他にもUnicode spaceを含むpath、ObservationPackのsession branch count、compactionのremovable-prefix推定などのissue/PRが出ている。公開直後の高速開発中なので、「NVIDIA製だから枯れている」とは扱わない方がいい。</p></section>
<section class="section" id="sp-d-security"><h2>セキュリティ境界</h2><p>SoL-Pi自身はsandboxではなく、読み込んだPi processと同じfilesystem・process・network・credential権限で動く。Action Fusionはmodel指定commandを実行できる。ObservationPackとReducerはsession配下へtool出力/logを保存し、自動削除されない。Reducerのlikely-secret detectorは完全なsecret scannerではなく、remote reductionを有効にすると対象logがconfigured modelへ送られるため、秘密を含むlogには使わないよう公式も警告している。</p><p>Project-local <code>.pi/sol-pi.json</code> はtrusted repositoryだけで使うべき。A.S.T.R.A.へ思想を移植する場合も、「効率化機構」をpermission boundaryだと誤認しない設計が必要になる。</p></section>
<section class="section" id="sp-d-judgement"><h2>今回の判断</h2><p class="lead">採用価値は高い。ただし、いまA.S.T.R.A.へSoL-Piそのものを入れる話ではない。</p><p>ユーザー環境の主経路はChatGPT / ChatBridge / DevSpace / GitHubで、SoL-PiはPi coding agentのextensionだ。直接導入すると別harnessを増やすことになり、運用系統をむしろ複雑にする。価値が高いのは、<strong>「大出力をhandle化する」「決定論的な隣接操作だけ融合する」「要約を原文検証する」「意味境界でcompactionする」「run固有orchestrationを使い捨てる」</strong>という5つの設計原理を、既存A.S.T.R.A.へ選択的に移すことだ。</p><p>特に今のA.S.T.R.A.開発で長いtool出力と引き継ぎがボトルネックなら、第一候補はObservationPack型のarchive＋paged recall。次にAction Fusion型の「編集→決定論的検証」をBridge/DevSpace tool contractへ閉じ込める方式。Reducerは情報損失・秘密送信のリスクがあるので後順位が妥当だ。</p></section>
