<script>
(()=>{
const makeTerm=(label,desc,original)=>{const s=document.createElement('span');s.className='term';s.textContent=label;s.dataset.term=`${label}|${desc}|${original||''}`;return s};
function annotateFirst(root,needle,label,desc,original){
 if(!root)return false;
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){const p=n.parentElement;if(!p)return NodeFilter.FILTER_REJECT;if(p.closest('.term,script,style,svg,a,code,pre,button,.meta,.article-kicker,.source-list'))return NodeFilter.FILTER_REJECT;return n.nodeValue.includes(needle)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}});
 const n=walker.nextNode();if(!n)return false;const i=n.nodeValue.indexOf(needle);const frag=document.createDocumentFragment();if(i)frag.append(document.createTextNode(n.nodeValue.slice(0,i)));frag.append(makeTerm(label,desc,original));if(i+needle.length<n.nodeValue.length)frag.append(document.createTextNode(n.nodeValue.slice(i+needle.length)));n.replaceWith(frag);return true;
}
function annotateEachPanel(id,items){const root=document.getElementById(id);if(!root)return;for(const panel of root.querySelectorAll('.mode-panel'))for(const item of items)annotateFirst(panel,...item)}

const r=document.getElementById('reaction-hyperspace');
if(r){
 const kicker=r.querySelector('.article-kicker');if(kicker)kicker.textContent='化学 / 査読済み · 2026-07-02公開 · 2026-09-15再発掘';
 const title=r.querySelector('.article-head h1');if(title)title.textContent='ロボットが960条件を実験し、未知の反応経路を発見';
 const dek=r.querySelector('.article-head .dek');if(dek)dek.innerHTML='化学合成の査読誌「<span class="term" data-term="Nature Synthesis|化学合成を扱う査読付き学術誌。この研究の掲載誌。|Nature Synthesis">Nature Synthesis</span>」に掲載された研究です。研究チームは、135年前から知られる<span class="term" data-term="ビギネリ反応|3種類の材料を一度に反応させて環状の有機分子を作る、古典的な多成分反応。|Biginelli reaction">ビギネリ反応</span>で、材料の濃度を変えた960通りの条件をロボットに試させました。その結果、これまで報告されていなかった二環性生成物と、その生成物へ至る反応経路を見つけました。';
 const section=r.querySelector('[data-mode-panel="overview"] .section');
 if(section)section.innerHTML=`<div class="qa-overview"><p class="qa-first"><strong>化学合成の研究チームは、135年前から知られる<span class="term" data-term="ビギネリ反応|3種類の材料を一度に反応させて環状の有機分子を作る、古典的な多成分反応。|Biginelli reaction">ビギネリ反応</span>について、材料の濃度を変えた<span class="qa-key">960通りの条件をロボットで実験</span>しました。</strong> その結果、従来は報告されていなかった複雑な二環性生成物と、その生成物へ至る反応経路を見つけました。</p><p>研究チームは、各条件で目的の生成物がどれだけできたかだけでなく、副生成物を含めて何が生じたかを広く測定しました。多数の条件を同じ方法で比較したことで、普段は主生成物に隠れて見落とされる反応の分岐を拾えました。</p><div class="qa-snapshot"><div class="qa-row"><strong>何をしたか</strong><span>4種類×4種類×6種類×10種類の濃度条件を組み合わせ、合計960通りを同じ温度・時間で反応させました。</span></div><div class="qa-row"><strong>何が見つかったか</strong><span>従来のビギネリ反応では報告されていなかった二環性生成物と、その生成物へ至る別の反応経路です。</span></div><div class="qa-row"><strong>なぜ重要か</strong><span>ロボット実験を、既知の目的物の条件最適化だけでなく、<span class="qa-proof">未知の生成物や反応経路を探索するためにも使える</span>ことを示した実例です。</span></div><div class="qa-row"><strong>どこまで確かか</strong><span>論文は査読済みで、実験データと解析コードも公開されています。一方、この探索法が他の化学反応でも同じ効率で未知経路を見つけられるかは今後の検証が必要です。</span></div></div><div class="chem-media qa-real-media"><div class="media-head"><span>実物｜論文 Figure 1</span><a href="https://www.nature.com/articles/s44160-026-01096-3#Fig1" target="_blank" rel="noopener">原図と説明を開く ↗</a></div><a href="https://www.nature.com/articles/s44160-026-01096-3#Fig1" target="_blank" rel="noopener"><img src="https://media.springernature.com/full/springer-static/image/art%3A10.1038%2Fs44160-026-01096-3/MediaObjects/44160_2026_1096_Fig1_HTML.png" alt="ロボット化学装置と960条件の探索・解析手順を示す論文図" loading="lazy"></a><div class="media-caption"><strong>見る場所：</strong>上段は実際に使ったロボット装置、下段は多数の反応液を測定し、未知成分を見つけていく解析手順です。概念図ではなく、この研究の装置と実験手順そのものです。</div></div></div>`;
}

annotateEachPanel('reaction-hyperspace',[
 ['Robowski','実験自動化ロボット「Robowski」','多数の化学条件を自動で作り分け、反応を実行するために研究チームが使った装置。','Robowski'],
 ['HPLC–NMR','液体分離と核磁気共鳴を組み合わせる分析（HPLC–NMR）','混合物を液体クロマトグラフィーで分けながら、核磁気共鳴で各成分の構造を調べる分析法。','HPLC–NMR'],
 ['HPLC-NMR','液体分離と核磁気共鳴を組み合わせる分析（HPLC–NMR）','混合物を液体クロマトグラフィーで分けながら、核磁気共鳴で各成分の構造を調べる分析法。','HPLC-NMR'],
 ['UV–Vis','紫外・可視吸収分光（UV–Vis）','紫外線と可視光を試料へ当て、どの波長をどれだけ吸収するかから成分の違いを調べる測定法。','UV–Vis spectroscopy'],
 ['MECH','反応機構を推定する人工知能（MECH）','候補となる化学反応の進み方を生成・評価する研究用の人工知能。','MECH'],
 ['hyperspace','多次元の反応条件空間（hyperspace）','濃度など複数の実験条件を軸にした多次元の探索範囲を指す表現。','hyperspace'],
 ['supramolecular','分子同士の弱い相互作用でできる集合構造（supramolecular）','水素結合など比較的弱い相互作用で分子が集まってできる構造。','supramolecular'],
 ['NMR','核磁気共鳴測定（NMR）','原子核の磁気的性質を利用して分子構造を調べる分析法。','nuclear magnetic resonance']
]);
annotateEachPanel('bci-multi',[
 ['ECoG','脳表面の電気活動を測る方法（ECoG）','脳の表面に電極を置き、神経集団の電気活動を直接測る方法。','electrocorticography'],
 ['False Negative','本当は該当するのに見逃す誤り（false negative）','実際には発話や身振りを試みているのに、判定器が無動作と判断する誤り。','false negative'],
 ['cross-modality rest training','別種類の行動を無動作例として学習する方法','発話判定では身振りだけの時間を無動作例に使うなど、並列動作時の誤検出を減らす訓練法。','cross-modality rest training']
]);
annotateEachPanel('solpi',[
 ['Action Fusion','編集と検証を一つの呼び出しにまとめる機構','編集直後に必ず行うテストなどを同じツール呼び出しへまとめ、不要な往復を減らす仕組み。','Action Fusion'],
 ['ObservationPack','巨大な出力を保存し、短い参照だけ渡す機構','長いログやファイルを毎回人工知能へ送り直さず、保存先と短い抜粋だけを文脈へ残す仕組み。','ObservationPack'],
 ['Online Context Compact','会話履歴を早めに圧縮する機構','文脈上限まで待たず、作業区切りで履歴を圧縮して後続の入力を軽くする仕組み。','Online Context Compact'],
 ['Evidence-Preserving Reducer','原文との一致を確認しながらログを要約する機構','長いログを小さなモデルで要約しても、採用した引用が保存済み原文と一致することを確認する仕組み。','Evidence-Preserving Reducer'],
 ['held-out','開発中に見せていない検証用データ','調整には使わず、最後の性能確認だけに使うデータ。','held-out'],
 ['EdgeBench','長時間AIエージェント向け性能比較試験「EdgeBench」','SoL-Piの研究で効率と能力維持を評価するために使われたベンチマーク。','EdgeBench'],
 ['Terminal-Bench 4','端末操作型エージェントの性能比較試験「Terminal-Bench 4」','端末上の実作業を通してコーディングエージェントを評価するベンチマーク。','Terminal-Bench 4']
]);
annotateEachPanel('agentzero',[
 ['Memory Events','出来事を時系列で残す記憶（Memory Events）','何が起き、いつ変化したかを時間順に保持する記憶表現。','Memory Events'],
 ['Entity–Event Graph','人物・案件と出来事を結ぶ関係グラフ','人、組織、プロジェクトなどの対象と出来事を結び、多段の関係をたどれる構造。','Entity–Event Graph'],
 ['HDM','長く使う確定情報を階層化した文書記憶（HDM）','プロフィールや好みなど、比較的安定した情報を段階的に開ける文書構造として保持する記憶。','HDM'],
 ['provenance','情報の出典・由来','その記憶がどの会話、文書、ツール出力から来たかを追跡する情報。','provenance'],
 ['Citation lock','回答の根拠を実際に開いた記憶へ限定する仕組み','検索中に確認した記憶だけを回答の根拠として引用できるようにする制約。','Citation lock']
]);
annotateEachPanel('wild',[
 ['IMU','身体や装置の動きを測る慣性計測装置（IMU）','加速度や角速度を測り、頭部や身体の動きを記録するセンサー。','inertial measurement unit'],
 ['BLE','省電力の近距離無線通信（BLE）','低消費電力で機器同士を接続するBluetoothの通信方式。','Bluetooth Low Energy']
]);
annotateEachPanel('voice',[
 ['faster-whisper','現在MIRAで使っている高速音声認識実装「faster-whisper」','Whisper系の音声認識を高速に実行するための実装。','faster-whisper'],
 ['arXiv','査読前論文の公開サイト「arXiv」','研究者が査読前の論文や技術報告を公開できるプレプリントサーバー。','arXiv']
]);
})();
</script>
