<div class="mode-panel active" data-mode-panel="overview"><div class="mode-layout"><main class="mode-main"><section class="section"><p class="overview-intro"><strong>Agent Zero Memoryは、AIの長期記憶を<span class="emph-accent">「検索できるログ」だけで終わらせず、時間・関係・信頼済み事実を別々に管理する</span>研究です。</strong> 会話、ファイル、接続サービスの履歴を三つの記憶へ整理し、回答時には実際に開いた証拠だけを引用できる制約を入れます。</p><div class="overview-points"><div class="overview-point"><b>何が新しい？</b><p>時系列の出来事、人物やプロジェクトの関係グラフ、長く使う確定情報の文書記憶を並行して持ちます。一つのベクトルDBだけに頼りません。</p></div><div class="overview-point"><b>何が良い？</b><p>「前はAだったが後でBへ変わった」「この判断はどの会話が根拠か」のような、更新履歴と証拠を伴う質問へ強い設計です。</p></div><div class="overview-point"><b>どこまで確定？</b><p>公開ベンチマークでは非常に強い一方、2026年8月30日のarXiv v1で、査読・独立再現・長期の実運用データはまだありません。完成済み製品と見るのは早いです。</p></div></div><div class="meaning-callout">A.S.T.R.A.に効くのは「この製品を入れる」ことより、<strong>記憶を種類別に分け、出典と更新履歴を消さず、回答時に証拠へ戻れるようにする</strong>設計思想。<small>Funesが「過去ログを後から検索する」補助層なら、こちらは記憶そのものをどう構造化するかの設計図に近いです。</small></div></section><div class="feedback" data-article="agentzero"></div></main><aside class="toc"><h4>概要</h4><a href="#">全体像</a><div class="hint">ベンチマーク値より、記憶を一つの箱にしないことと証拠管理の考え方が重要。</div></aside></div></div>
<div class="mode-panel" data-mode-panel="explain"><div class="mode-layout"><main class="mode-main"><section class="section" id="az-e-problem"><h2>一つの記憶方式では足りない</h2><p>長期記憶では、質問によって必要な構造が変わります。「いつ方針が変わった？」には時系列が必要で、「AさんとプロジェクトBはどうつながる？」には関係構造が必要で、「本人が確定させた好みは？」には推測より信頼済み文書が向きます。</p><p>論文は、これらを一つのベクトル検索や一枚の知識グラフへ押し込むと、それぞれの苦手分野を引き継ぐと考えます。そこで同じ履歴から三つの表現を維持します。</p><div class="plain-list"><div><strong>Memory Events：</strong>何が起き、いつ変わったかを残す時系列。</div><div><strong>Entity–Event Graph：</strong>人・組織・プロジェクトと出来事を結び、多段の関係をたどるグラフ。</div><div><strong>HDM：</strong>プロフィール、好み、重要案件など、長く使う情報を階層化した文書記憶。短い要約から全文まで段階的に開けます。</div></div></section><section class="section" id="az-e-read"><h2>答える前に「証拠を開く」</h2><p>検索時は、まずその質問に長期記憶が必要かを小さな判定器で判断します。不要なら記憶検索をせず、そのまま通します。必要なら情報源を絞り、三つの記憶を並行検索します。</p><div class="clean-flow"><div class="clean-step"><strong>必要性を判定</strong><p>今の質問だけで答えられるなら記憶検索をしません。</p></div><div class="clean-arrow">→</div><div class="clean-step"><strong>三系統を並行検索</strong><p>意味検索と単語一致を併用し、期間・発言者・情報源なども検索側が指定します。</p></div></div><p>重要なのが<span class="term" data-term="Citation lock|回答で引用できる証拠を、その検索中に実際に開いた記憶項目へ限定する制約。証拠を組み立てられなければ回答を控える。|citation-locked answer">引用ロック</span>です。回答に付ける根拠は、検索エージェントが実際に開いた項目だけに限定されます。根拠を構成できなければ推測せず回答を控える、という設計です。</p><p class="note">ただし、これは「AIが絶対に誤答しない」という意味ではありません。元データが誤っている、抽出時に誤って解釈する、複数証拠からの推論を間違える可能性は残ります。強いのは、少なくとも「見ていない記憶を根拠としてでっち上げる」経路を狭める点です。</p></section><section class="section" id="az-e-fit"><h2>A.S.T.R.A.で使うなら</h2><p>今あるHANDOFF、STATUS、WORK_LOGのような明示文書は残すべきです。そこへ、①変更履歴を消さないイベント層、②人物・案件・判断の関係を結ぶ層、③本人が明示した確定情報だけを置く信頼層、④どの出力も元証拠へ戻れるprovenanceを追加する形が相性良いです。</p><p>特にMIRAの「ユーザー理解」では、AIが推定した性格や傾向と、本人が直接述べた事実を同じ確度で保存しないことが重要です。論文の factual / experiential / working memory の分離は、その境界を設計する材料になります。</p></section><div class="feedback" data-article="agentzero"></div></main><aside class="toc"><h4>解説</h4><a href="#az-e-problem">3つの記憶</a><a href="#az-e-read">証拠を開く</a><a href="#az-e-fit">A.S.T.R.A.</a></aside></div></div>
<div class="mode-panel detail" data-mode-panel="detail"><div class="mode-layout"><main class="mode-main"><section class="section" id="az-d-build"><h2>Build側の処理</h2><p>原データは会話、ファイル、エージェントの実行履歴など。まず形式を正規化・分類し、すべてへ意味検索用の埋め込み索引と単語一致用の索引を付けます。その上で、LLMによる蒸留から出来事の時系列と記憶項目を作り、別の接続工程が人物・チーム・プロジェクトと出来事をグラフへ結びます。</p><p>重要なのは、蒸留後の記憶だけを唯一の保存物にしないこと。生の情報源は索引されたまま残るため、抽出器が当初「重要ではない」と判断した情報でも、後から原文へ戻れる設計です。更新も原則として古い値を消すのではなく履歴として残します。</p></section><section class="section" id="az-d-hdm"><h2>信頼済み文書を別格にする</h2><p><span class="term" data-term="HDM|Hierarchical Documentary Memory。信頼性を優先するプロフィール・好み・人物・節目・案件・パターン等を、短い要約から全文まで階層化して保持する記憶。|Hierarchical Documentary Memory">HDM</span>はL0の一行要約、L1の概要、L2の全文という三段階を持ちます。まず安い短文で場所を見つけ、本当に必要な項目だけ全文を開くことで、毎回すべてをコンテキストへ入れるのを避けます。</p><p>論文では、ユーザーが明示的にキュレーションしたノートを信頼層へ決定論的に対応させる方針を強調しています。つまり「AIが推測した人物像」と「本人が確定させた情報」を型として分離し、推測が基礎事実へ混ざりにくくします。</p></section><section class="section" id="az-d-results"><h2>ベンチマーク</h2><p>論文報告では、長期会話の更新・時間推論を測るLongMemEvalで<strong>95.60%</strong>、長期会話の複数情報統合を測るLoCoMoで<strong>93.60%</strong>。著者が比較した従来最良値より、それぞれ0.73ポイント、1.10ポイント上回っています。</p><p>8種類の基盤モデルを入れ替えた試験では、精度差は3.4ポイントに収まる一方、1問い合わせの費用は約30倍違いました。小型のオープンモデルでもLongMemEval 92.2%に到達し、最高構成のおよそ20分の1の問い合わせ費用だったと報告されています。</p><p class="note">ここで注目すべきなのは「30倍速い・30倍安いシステム」ではありません。モデルの選択で費用は大きく変わるのに、同じ記憶構造を使う限り精度差が比較的小さかった、という観測です。</p></section><section class="section" id="az-d-limits"><h2>まだ信用しすぎない理由</h2><div class="evidence-band confirmed"><b>確認できる</b><p>アーキテクチャ、公開ベンチマーク結果、比較条件はarXiv論文に具体的に記載されています。</p></div><div class="evidence-band reported"><b>著者報告</b><p>最高精度やコスト差は著者自身の評価です。公開から日が浅く、独立した再現研究は今回確認できませんでした。</p></div><div class="evidence-band unknown"><b>未確認</b><p>長年運用したときの誤った記憶の蓄積、複数ユーザーでの権限制御、情報削除要求、実サービス規模の運用コストはベンチマークだけでは分かりません。今回の探索では実装コードの公式公開も確認できませんでした。</p></div><p>また「fabricationを構造的に排除」という表現は、citation lockの規則に従う引用経路についての主張として読むべきです。情報源そのものやLLM推論まで真実になるわけではありません。</p><div class="source-list"><div class="source"><div><b>arXiv:2608.29606</b><span>原論文・2026-08-30 v1</span></div><a href="https://arxiv.org/abs/2608.29606" target="_blank">開く ↗</a></div><div class="source"><div><b>alphaXiv</b><span>論文内容の二次整理。原論文との照合用</span></div><a href="https://www.alphaxiv.org/abs/2608.29606" target="_blank">開く ↗</a></div></div></section><div class="feedback" data-article="agentzero"></div></main><aside class="toc"><h4>詳細</h4><a href="#az-d-build">Build</a><a href="#az-d-hdm">HDM</a><a href="#az-d-results">評価</a><a href="#az-d-limits">限界</a></aside></div></div></div></div>

<div class="overlay" id="wild" style="--article-accent:#73c7ff"><div class="article-shell"><div class="article-nav"><div class="nav-left"><strong>RADAR</strong><span>NEUROTECH / OPEN HARDWARE</span></div><div class="depth-switch"><button data-mode="overview" class="active">概要</button><button data-mode="explain">解説</button><button data-mode="detail">詳細</button></div><button class="close">×</button><div class="reading-progress"><i></i></div></div><div class="article-head"><div><div class="article-kicker">NEUROSCIENCE / NATURALISTIC BEHAVIOR</div><h1>WILD</h1><div class="dek">脳を測るために動物の行動を縛るのではなく、動いている状態へ計測装置の方を持ち込む小型ワイヤレス基盤。</div></div><aside class="article-aside"><div class="rings" data-scores="86,95,89,72"></div><div class="article-actions"><button class="chatcopy" data-prompt="WILD（Wireless, Interactive, Lightweight Datalogger）の論文について、ハードウェア構成、同期精度、記録チャネル、オンボード処理、閉ループ刺激、実験結果、オープンソース部分、研究上の限界まで詳しく説明して。">Chat用コピー</button><button class="extra-deep" data-extra-deep="wild">次回深掘り</button></div></aside></div>
<div class="mode-panel active" data-mode-panel="overview"><div class="mode-layout"><main class="mode-main"><section class="section"><p class="overview-intro"><strong>WILDは、マウスなどの小動物へ載せ、<span class="emph-accent">脳活動・動き・鳴き声・カメラ映像を同時に記録しながら、特定の脳活動を検出した瞬間に刺激まで返せる</span>ワイヤレス装置です。</strong> ケーブルにつながれた実験では難しかった、複数個体の社会行動や屋外行動を脳活動と一緒に調べるために作られました。</p><div class="overview-points"><div class="overview-point"><b>何ができる？</b><p>電気生理記録、9軸の動き計測、超音波マイク、頭部カメラ、光刺激を一つの小型系へ統合します。</p></div><div class="overview-point"><b>なぜ重要？</b><p>脳を詳しく測るためのケーブル自体が、視線・移動・他個体との接触を変えてしまう問題を減らし、より自然な行動中の神経活動を測れます。</p></div><div class="overview-point"><b>確度</b><p>Nature Methodsで査読済み。ソースコード、PCB、解析コード、3D部品、データも公開されています。ただし研究対象は小動物で、人間用BCIの成果ではありません。</p></div></div><div class="meaning-callout">面白いのは「ワイヤレス化」だけではなく、<strong>記録 → その場で信号解析 → 条件成立 → 刺激</strong>を頭上の小さな装置で閉じられること。<small>行動を後から見るだけでなく、特定の神経状態に合わせて実験条件をリアルタイムで変えられます。</small></div></section><div class="feedback" data-article="wild"></div></main><aside class="toc"><h4>概要</h4><a href="#">全体像</a><div class="hint">自然な行動を壊しにくい計測と、リアルタイム介入を同時に狙った研究基盤。</div></aside></div></div>
<div class="mode-panel" data-mode-panel="explain"><div class="mode-layout"><main class="mode-main"><section class="section" id="w-e-why"><h2>ケーブルが実験を変えてしまう</h2><p>神経活動を高精度に記録する実験では、頭部の電極を外部装置へケーブルでつなぐ方法が一般的です。しかし複数個体が互いに接触する社会行動、広い空間の探索、屋外行動では、ケーブルが引っ掛かる、重さや向きが変わる、視線や移動範囲が狭まるといった問題が起きます。</p><p>WILDはデータをmicroSDへ記録し、Bluetooth Low Energyを制御・同期・低帯域プレビューへ使うことで、高速な神経波形を常時無線送信しなくても実験を続けられる構成です。</p></section><section class="section" id="w-e-sensors"><h2>一つの時系列へまとめる</h2><div class="plain-list"><div><strong>神経：</strong>公開ワークフローでは64チャネルの電気生理記録。</div><div><strong>動き：</strong>9軸IMUで頭部・身体運動を計測。</div><div><strong>音：</strong>超音波マイクでマウスの発声を記録。</div><div><strong>視線・環境：</strong>頭部カメラで瞳孔や周囲を撮影。</div><div><strong>介入：</strong>光遺伝学刺激とオンボード信号処理を組み合わせ、検出した神経状態へその場で反応。</div></div><p>装置間の時計を校正した後はPCとの常時接続を必要としません。論文の評価では、PCとの推定時計誤差は平均0.0±4.3 ms、無線通信遅延は74.0±13.5 msでした。BLEの安定通信はノートPC相手で最大70 mまで確認されています。</p></section><section class="section" id="w-e-open"><h2>研究装置として再利用できる</h2><p>論文の再現用データだけでなく、Neurologgerリポジトリにはドキュメント、解析用Python/MATLAB、PCB製造データ、3Dプリント部品、コンソールソフトが置かれています。GPL-3.0で公開され、現在の公開ワークフローは64チャネルを中心にしています。</p><p>論文ではラットを使った128チャネル・20 kHzの屋外記録も示されていますが、これは「公開標準構成がすべて128チャネル」という意味ではありません。リポジトリ自身も64チャネルを現在のオープンソース対象とし、Neuropixels互換などは別の研究対象として説明しています。</p></section><div class="feedback" data-article="wild"></div></main><aside class="toc"><h4>解説</h4><a href="#w-e-why">無線の意味</a><a href="#w-e-sensors">同時計測</a><a href="#w-e-open">公開範囲</a></aside></div></div>
<div class="mode-panel detail" data-mode-panel="detail"><div class="mode-layout"><main class="mode-main"><section class="section" id="w-d-hw"><h2>ハードウェア</h2><p>中核はCortex-M4系MCU、神経信号増幅器、9軸IMU、カメラ、超音波マイク、microSD、BLE。電源系は広い入力電圧から複数の3.3 V系統へ分離し、アナログ・デジタル・周辺回路の干渉を抑える設計です。外部I/Oから同期信号や接続機器も扱えます。</p><p>無線を「全生波形の転送」へ使わず、ローカル記録と組み合わせるため、通信帯域と接続台数の制約を回避しやすい構成です。屋外では複数マウスの軌跡と海馬活動を同時に記録し、ラットでは約12時間の低サンプリング記録も示されています。</p></section><section class="section" id="w-d-loop"><h2>閉ループ処理</h2><p>オンボードの神経信号プロセッサは、帯域フィルタ、位相推定、特定イベント検出などを装置内で処理します。論文の測定では処理遅延は5.56±0.09 µs。海馬のリップル検出をオフラインの手動調整済み検出器と比較すると、ROCのAUCはHilbert方式で0.97218、低域フィルタ方式で0.97422でした。</p><p>この値は「刺激まで5.56 µsで完了する」という意味ではありません。信号処理の内部演算遅延の指標であり、センサー取得、検出窓、刺激装置などを含む実験全体の応答時間とは分けて読む必要があります。</p></section><section class="section" id="w-d-quality"><h2>無線で質を落としていないか</h2><p>接地チャネルのRMSノイズ比較ではWILDが2.92±1.12 µV、比較したIntan RHD2000が2.80±1.95 µVで、32チャネルの対応比較はp=0.757でした。少なくともこの条件では有意なノイズ差は示されていません。</p><p>さらに同じ動物で有線から無線へ切り替えた単一ニューロン波形の安定性や、複数日にわたる記録も検証しています。一方で、すべての電極・行動条件・屋外環境で同じ品質が保証されるわけではありません。</p></section><section class="section" id="w-d-limits"><h2>研究としての限界</h2><div class="evidence-band confirmed"><b>強い点</b><p>査読済み論文で、機器評価・行動実験・閉ループ実験・屋外実験まで示し、ソースデータとハードウェア/ソフトウェアを公開しています。</p></div><div class="evidence-band reported"><b>適用範囲</b><p>成果はマウスとラットの侵襲的神経記録です。人間の脳を日常環境で読む技術へ直接つながった、と解釈してはいけません。</p></div><div class="evidence-band unknown"><b>今後</b><p>大規模な多数個体、長期間の屋外耐久性、異なる研究室での再現性、より高密度プローブを標準構成として運用した場合の電力・重量・データ量は今後の実装課題です。</p></div><div class="source-list"><div class="source"><div><b>Nature Methods</b><span>査読論文・2026-09-10</span></div><a href="https://www.nature.com/articles/s41592-026-03220-9" target="_blank">開く ↗</a></div><div class="source"><div><b>ayalab1/Neurologger</b><span>ハードウェア、ソフトウェア、解析、ドキュメント</span></div><a href="https://github.com/ayalab1/Neurologger" target="_blank">開く ↗</a></div></div></section><div class="feedback" data-article="wild"></div></main><aside class="toc"><h4>詳細</h4><a href="#w-d-hw">ハードウェア</a><a href="#w-d-loop">閉ループ</a><a href="#w-d-quality">信号品質</a><a href="#w-d-limits">限界</a></aside></div></div></div></div>
