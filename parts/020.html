function termify(root){if(!root)return;for(const n of [...(()=>{const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const a=[];while(w.nextNode())a.push(w.currentNode);return a})()]){const p=n.parentElement;if(!p||p.closest('.term,a,script,style,code,pre,button,.article-kicker,.nav-left'))continue;let text=n.nodeValue;let pos=0,changed=false;const frag=document.createDocumentFragment();while(pos<text.length){let best=null;for(const k of keys){const i=text.indexOf(k,pos);if(i<0)continue;if(!best||i<best.i||(i===best.i&&k.length>best.k.length))best={k,i};}if(!best)break;if(best.i>pos)frag.append(document.createTextNode(text.slice(pos,best.i)));const [label,desc,orig]=G[best.k],sp=document.createElement('span');sp.className='term';sp.textContent=label;sp.dataset.term=`${label}|${desc}|${orig}`;frag.append(sp);pos=best.i+best.k.length;changed=true;}if(changed){if(pos<text.length)frag.append(document.createTextNode(text.slice(pos)));n.replaceWith(frag);}}}
