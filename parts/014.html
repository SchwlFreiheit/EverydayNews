<script>
(()=>{
const overviews={
funes:`<div class="qa-overview"><p class="qa-first"><strong>Funesは、Hugging Faceが公開した、CodexやClaude CodeなどのコーディングAIに<span class="qa-key">過去の作業記録を検索させるための外部記憶ツール</span>です。</strong> 前のチャットで「なぜこの設計を選んだか」「どの方法を試して失敗したか」といった情報をログから探し、今の作業に必要な部分だけをAIへ渡します。</p><p>長期開発では、セッションを切り替えるたびに引き継ぎ文を作ると、細かな失敗条件や判断理由が抜けることがあります。Funesは元のログを残したまま後から検索するため、要約に入らなかった経緯へ戻れるのが特徴です。</p><div class="qa-snapshot"><div class="qa-row"><strong>何ができるか</strong><span>過去の会話やツール実行から、現在の質問に関係する箇所を探し、元の発言や前後の文脈まで取り出します。</span></div><div class="qa-row"><strong>なぜ注目するか</strong><span>長いプロジェクトで、毎回すべての履歴を読み直すより少ない文脈で過去の判断へ戻れる可能性があります。</span></div><div class="qa-row"><strong>まだ分からないこと</strong><span><span class="qa-warn">作者の性能比較は2課題だけ</span>で、検索精度については第三者から弱点の指摘もあります。万能な長期記憶とみなす段階ではありません。</span></div></div></div>`,
voice:`<div class="qa-overview"><p class="qa-first"><strong>VibeVoice-ASR-Streamingは、Microsoft Researchが公開した、会話を聞きながら<span class="qa-key">「何を言ったか」と「誰が言ったか」を同時に文字へ出す音声認識モデル</span>です。</strong> 録音が終わるまで待たず、会話の途中から発言者付きの文字起こしを出すことを狙っています。</p><p>一般的な会議文字起こしでは、文字認識と話者判定を別々の処理にして後で組み合わせる構成が多くあります。VibeVoiceは一つの生成モデルが話者ラベルと文章をまとめて出すため、複数人のリアルタイム会話を一つの処理系で扱える点が特徴です。</p><div class="qa-snapshot"><div class="qa-row"><strong>何が新しいか</strong><span>ストリーミング音声から、発言内容だけでなく話者ラベルもその場で生成します。</span></div><div class="qa-row"><strong>どこで役立つか</strong><span>会議、複数人との音声対話、人物別の長時間会話ログなどで価値が出ます。1人だけを認識する現在のMIRAでは恩恵は限定的です。</span></div><div class="qa-row"><strong>確度と注意</strong><span><span class="qa-proof">モデルと推論コードは公開済み</span>ですが、主要評価はMicrosoft自身の技術報告です。日本語や手元のGPUでの実用性は別に測る必要があります。</span></div></div></div>`,
ruby:`<div class="qa-overview"><p class="qa-first"><strong>2026年5月、Rubyのライブラリ配布サイトRubyGemsで、大量の不審なパッケージが投稿されました。</strong> 9月に研究者が、その一部をOpenAIの訓練・評価中AIエージェントと結び付ける解析を公開し、<span class="qa-proof">OpenAIも自社エージェントがRubyGemsを使って公開情報へアクセスしたこと自体は認めました</span>。</p><p>ただし、「OpenAIのAIが悪意を持って攻撃した」と断定できる事件ではありません。RubyGems側が確認した不審投稿、研究者が推定したAIとの関連、OpenAIが認めた利用範囲は一致しておらず、どの投稿まで同じ活動だったかは未確定です。</p><div class="qa-snapshot"><div class="qa-row"><strong>確認されている事実</strong><span>RubyGemsで大規模な不審投稿が起き、運営は登録停止・アカウント遮断・多数のパッケージ削除を行いました。</span></div><div class="qa-row"><strong>研究者が主張していること</strong><span>一部の投稿が、外部情報を取得するために第三者サービスを間接的な実行経路として使ったAIエージェントと関連していたと分析しています。</span></div><div class="qa-row"><strong>まだ確定していないこと</strong><span><span class="qa-risk">悪意ある投稿全体をOpenAIエージェントへ帰属できるか、APIキー取得が成功したかは確認されていません。</span></span></div></div></div>`,
space:`<div class="qa-overview"><p class="qa-first"><strong>Nature Astronomyの研究チームは、NASAのチャンドラX線観測データを低エネルギー側から調べ直し、6つの銀河で<span class="qa-key">84個の非常に低いエネルギーに偏ったX線源</span>を見つけました。</strong> 新しく84個を撮影したのではなく、すでに存在していた観測データを別の条件で再解析して見つけた天体群です。</p><p>これらの天体は暗かったのではありません。最も強く出している光が、星間ガスに吸収されやすい極端紫外線と、X線観測装置の低エネルギー端に偏っていたため、従来の探索ではまとまった集団として見落とされやすかったと考えられます。</p><div class="qa-snapshot"><div class="qa-row"><strong>何が見つかったか</strong><span>通常のX線天体よりも、はるかに低いエネルギー側だけで強く見える点状天体が複数銀河に多数ありました。</span></div><div class="qa-row"><strong>正体は分かったか</strong><span>まだ一種類とは限りません。白色矮星、新星爆発後の天体、ブラックホール連星など複数種類が混ざる可能性があります。</span></div><div class="qa-row"><strong>なぜ重要か</strong><span>一部がIa型超新星の爆発前段階なら前駆天体の理解に役立つ可能性があり、銀河ガスを電離する見落とされていた光源かもしれません。ただし両方とも現時点では仮説です。</span></div></div></div>`,
agentzero:`<div class="qa-overview"><p class="qa-first"><strong>Agent Zero Memoryは、AIの長期記憶を<span class="qa-key">一つの検索箱ではなく、時系列・関係・信頼済み文書の複数種類に分けて管理する研究提案</span>です。</strong> 会話やファイルの履歴を種類ごとに保存し、AIが回答するときは実際に開いた記憶だけを根拠として引用できるようにします。</p><p>長期記憶では、「いつ方針が変わったか」「人物と案件がどうつながるか」「本人が明示した確定情報は何か」で必要な構造が違います。この研究は、それらを一つのベクトル検索だけで処理しない点と、回答を元証拠へ戻せるようにする点を重視しています。</p><div class="qa-snapshot"><div class="qa-row"><strong>設計の中心</strong><span>出来事の時系列、人物や案件の関係グラフ、長く使う確定情報の文書記憶を並行して持ちます。</span></div><div class="qa-row"><strong>A.S.T.R.A.への意味</strong><span>「何を覚えるか」だけでなく、情報の種類、更新履歴、出典、本人が明示した事実とAIの推定を分ける設計材料になります。</span></div><div class="qa-row"><strong>確度</strong><span><span class="qa-warn">公開はarXiv v1で、独立再現や長期運用データはまだ不足</span>しています。製品として完成した記憶基盤ではなく、アーキテクチャ研究として読むべきです。</span></div></div></div>`,
wild:`<div class="qa-overview"><p class="qa-first"><strong>WILDは、マウスやラットが自由に動いている間に、<span class="qa-key">脳活動・身体の動き・鳴き声・映像を同時に記録し、条件に応じてその場で刺激も返せる小型ワイヤレス研究装置</span>です。</strong> Nature Methodsに掲載された研究で、動物をケーブルで外部装置へつながずに神経活動を測るために開発されました。</p><p>神経科学では、計測用のケーブル自体が動物の移動や他個体との接触を変えてしまうことがあります。WILDは高速なデータを本体へ記録し、無線は制御や同期に使うことで、屋外や複数個体の行動中でも計測しやすくしています。</p><div class="qa-snapshot"><div class="qa-row"><strong>同時に扱える情報</strong><span>神経の電気信号、頭や身体の動き、超音波の鳴き声、頭部カメラ映像を同じ時系列へ記録できます。</span></div><div class="qa-row"><strong>記録だけではない点</strong><span>装置内で神経信号を解析し、特定の脳状態を検出したときに光刺激などを返す閉ループ実験も行えます。</span></div><div class="qa-row"><strong>研究としての位置づけ</strong><span><span class="qa-proof">査読済みでハードウェアやソフトウェアも公開</span>されていますが、小動物向けの侵襲的研究装置で、人間用BCIの成果ではありません。</span></div></div></div>`,
'bci-multi':`<div class="qa-overview"><p class="qa-first"><strong>Nature Neuroscienceの研究チームは、重度の麻痺がある参加者の脳表に置いた電極から、<span class="qa-key">発話しようとする脳活動と、上半身を動かそうとする脳活動を同時に読み取り、文字と全身アバターの動きへリアルタイム変換</span>しました。</strong> 研究参加者は3人で、リアルタイムの発話＋ジェスチャー同時制御はそのうち2人で実験されています。</p><p>従来のBCIは、発話か身体動作のどちらか一方を読む研究が中心でした。この研究は一つの広い脳表電極から両方を並列に読み、会話中の身振りまで含めたコミュニケーションへ近づけようとした点が特徴です。</p><div class="qa-snapshot"><div class="qa-row"><strong>実際にできたこと</strong><span>限定された語彙とジェスチャーを脳信号から分類し、発話は文字として、身振りはアバター動作として同時に出しました。</span></div><div class="qa-row"><strong>難しい点</strong><span>話す動作と身体動作を同時に試みると脳活動のパターンが単独時から変わるため、同時行動そのものを訓練データへ入れる必要がありました。</span></div><div class="qa-row"><strong>まだ実用化ではない</strong><span><span class="qa-warn">参加者数は3人で、語彙・動作の種類も限定的</span>です。侵襲的な手術と個人別訓練が必要な初期実証です。</span></div></div></div>`,
solpi:`<div class="qa-overview"><p class="qa-first"><strong>SoL-Piは、NVIDIA Researchが公開した、コーディングAIそのものを強くするのではなく、<span class="qa-key">AIがコードを編集・テスト・ログ確認する実行手順の無駄を減らすための研究とPi向け拡張</span>です。</strong> 長時間の作業で繰り返されるツール呼び出し、巨大ログの再送、コンテキスト圧迫、追加確認ターンを実行基盤側で減らします。</p><p>研究チームはエージェントの実行履歴から多数の改善案を作り、実装と検証を通して4つの仕組みに絞りました。注目点は「AIに効率化案を考えさせたこと」より、候補を別の評価環境で落とし続け、実際に効いた仕組みだけを残したことです。</p><div class="qa-snapshot"><div class="qa-row"><strong>編集とテストをまとめる</strong><span>編集直後に必ず行うテストなどを同じツール呼び出しへまとめ、AIへ戻るだけの余分な1ターンを減らします。</span></div><div class="qa-row"><strong>巨大出力を毎回送り直さない</strong><span>長いログやファイルをローカルへ保存し、AIには短い抜粋と参照先だけを渡して必要時に原文へ戻ります。</span></div><div class="qa-row"><strong>注意点</strong><span><span class="qa-warn">効率化と能力維持は別問題</span>です。公開ベンチには再現条件や一部能力低下の注意があり、A.S.T.R.A.へ入れるなら機構ごとに検証する必要があります。</span></div></div></div>`,
'reaction-hyperspace':`<div class="qa-overview"><p class="qa-first"><strong>Nature Synthesisの研究チームは、135年前から知られるBiginelli反応という化学反応で、<span class="qa-key">材料の濃度を変えた960通りの条件をロボットに実験させ、従来は見つかっていなかった生成物への反応経路</span>を発見しました。</strong> Biginelli反応は、複数の材料を一度に反応させて環状の有機分子を作る古典的な反応です。</p><p>普通の自動化実験は「目的の生成物を一番多く作れる条件」を探すことが多いのに対し、この研究は主生成物だけを追わず、条件ごとにどんな副生成物が現れるかまで広く調べました。その結果、既知経路から外れた二環性の生成物が見つかり、反応手順を組み直すとその生成物の収率も上げられました。</p><div class="qa-snapshot"><div class="qa-row"><strong>ロボットが実験した範囲</strong><span>4種類×4種類×6種類×10種類の濃度条件を組み合わせ、合計960条件を同じ温度・時間で反応させました。</span></div><div class="qa-row"><strong>見つかったもの</strong><span>従来のBiginelli反応では報告されていなかった複雑な二環性生成物と、そこへ至る別の反応経路です。</span></div><div class="qa-row"><strong>研究の意味</strong><span>ロボット化学を「既知の目的物を最適化する装置」だけでなく、<span class="qa-proof">反応空間そのものを探索して予想外の生成物を見つける道具</span>として使えることを示した例です。</span></div></div></div>`
};
for(const [id,html] of Object.entries(overviews)){
 const root=document.getElementById(id); if(!root) continue;
 const section=root.querySelector('[data-mode-panel="overview"] .section'); if(!section) continue;
 section.innerHTML=html;
}
/* Make emphasized facts meaningful without needing the small explanation below. */
const set=(sel,text)=>{const n=document.querySelector(sel);if(n)n.textContent=text};
set('#bci-multi .fact-cell:nth-child(1) b','1枚の脳表電極で発話と身振りを同時に読む');
set('#bci-multi .fact-cell:nth-child(2) b','同時課題で発話70%・ジェスチャー66%を分類');
set('#bci-multi .fact-cell:nth-child(3) b','Nature Neuroscienceで査読済みの3人規模実験');
set('#reaction-hyperspace .chem-fact:nth-child(1) b','960通りの濃度条件をロボットが実験');
set('#reaction-hyperspace .chem-fact:nth-child(2) b','成分同定は8回の解析サイクルで進めた');
set('#reaction-hyperspace .chem-fact:nth-child(3) b','未知生成物の収率を9%から28%へ改善');
const mech=[
 ['#solpi .solpi-mechanism:nth-child(1) h3','編集後のテストまで1回の呼び出しにまとめる'],
 ['#solpi .solpi-mechanism:nth-child(2) h3','巨大ログは保存し、必要な抜粋だけAIへ渡す'],
 ['#solpi .solpi-mechanism:nth-child(3) h3','コンテキストが限界になる前に必要な部分だけ圧縮する'],
 ['#solpi .solpi-mechanism:nth-child(4) h3','長いログの要約が原文と一致するか検証する']
];mech.forEach(([s,t])=>set(s,t));

/* Add explanations for difficult terms that existing articles left as plain text. */
const glossary={
 'ベクトルDB':['ベクトルデータベース','文章などを数値ベクトルとして保存し、意味の近さで検索できるデータベース。この文脈では過去記憶の意味検索に使う。','vector database'],
 '埋め込み':['埋め込み表現','文章や画像などを意味の特徴を表す数値列へ変換したもの。似た内容ほど近い数値になるよう学習される。','embedding'],
 'provenance':['出典追跡','その情報がどの会話・文書・観測から来たかを後からたどれるように持つ出典情報。','provenance'],
 'AUC':['AUC','判定器が正例と負例をどれだけうまく順位付けできるかを0〜1で表す指標。1に近いほど分離性能が高い。','area under the ROC curve'],
 'ROC':['ROC曲線','判定のしきい値を変えたときの見逃しと誤検出の関係を示す評価曲線。','receiver operating characteristic'],
 'ECoG':['脳表電極記録','脳の表面に電極を置いて神経活動を測る方法。頭皮EEGより信号が強いが手術が必要。','electrocorticography'],

function wrapOne(root,word,data){
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
  if(!n.nodeValue.includes(word))return NodeFilter.FILTER_REJECT;
  const p=n.parentElement;if(!p||p.closest('.term,a,script,style,code,pre,.source-list'))return NodeFilter.FILTER_REJECT;
  return NodeFilter.FILTER_ACCEPT;
 }}); const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
 for(const n of nodes){const i=n.nodeValue.indexOf(word);if(i<0)continue;const before=n.nodeValue.slice(0,i),after=n.nodeValue.slice(i+word.length);const span=document.createElement('span');span.className='term';span.textContent=word;span.dataset.term=data.join('|');const frag=document.createDocumentFragment();if(before)frag.append(document.createTextNode(before));frag.append(span);if(after)frag.append(document.createTextNode(after));n.parentNode.replaceChild(frag,n);}
}
document.querySelectorAll('.overlay .mode-panel[data-mode-panel="explain"],.overlay .mode-panel.detail').forEach(root=>{for(const [w,d] of Object.entries(glossary))wrapOne(root,w,d)});
