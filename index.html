<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EverydayNews</title><style>html,body{margin:0;background:#090a0b;color:#f3efe7;font-family:system-ui,sans-serif}body{display:grid;place-items:center;min-height:100vh}.loading{opacity:.65;font-size:14px;letter-spacing:.08em}</style></head><body><div class="loading">LOADING RADAR…</div><script>(async()=>{try{let html='';for(let i=1;i<=9;i++){const n=String(i).padStart(3,'0');const r=await fetch(`parts/${n}.html`);if(!r.ok)throw new Error(`part ${n}`);html+=await r.text()}document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<pre style="padding:24px">Failed to load EverydayNews: '+e.message+'</pre>'}})();</script></body></html>
