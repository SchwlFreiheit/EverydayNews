<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>EverydayNews</title>
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="EverydayNews home">EverydayNews</a>
    <div class="header-meta">
      <span id="issueDate">16 SEP 2026</span>
      <span id="articleCount"></span>
    </div>
  </header>

  <main class="page">
    <section class="intro">
      <p class="eyebrow">DISCOVERY RADAR</p>
      <h1>見逃しやすい技術・研究・実践知</h1>
      <p>一覧では「何の記事か」だけを短く確認し、開いた記事で概要・解説・詳細を切り替えます。</p>
    </section>

    <section class="feed" id="feed" aria-label="記事一覧"></section>

    <section class="watch-section" id="watchSection" hidden>
      <div class="section-heading">
        <h2>Watch</h2>
        <span>確度が足りず、本記事には上げていない兆候</span>
      </div>
      <div class="watch-list" id="watchList"></div>
    </section>
  </main>

  <div id="articleLayer"></div>
  <div class="term-popover" id="termPopover" role="dialog" aria-modal="false" hidden></div>

  <script type="module" src="./assets/app.js"></script>
</body>
</html>
